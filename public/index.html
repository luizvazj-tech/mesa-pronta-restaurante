<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesa Pronta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: barra lateral escura + área de trabalho clara; módulos operados por abas, cartões densos */
:root{--bg:#f2f5f6;--surface:#fff;--surface2:#eaf0f1;--ink:#14282a;--muted:#5d7173;--line:#d5dfe1;--brand:#0f4c4a;--brand-ink:#fff;--accent:#d98e04;--ok:#17803d;--okbg:#e0f3e6;--warn:#a86a00;--warnbg:#fdf0d0;--bad:#b42318;--badbg:#fde4e1;--side:#0c2f2e;--sideink:#cfe3e1;
--fd:'Bricolage Grotesque',system-ui,sans-serif;--fb:'Hanken Grotesk',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d1a1b;--surface:#14262a;--surface2:#1b3236;--ink:#e6f0ef;--muted:#92aaab;--line:#27424a;--brand:#2fa39b;--brand-ink:#04201f;--accent:#f0b030;--ok:#5bd68a;--okbg:#12361f;--warn:#f0b030;--warnbg:#3a2c0a;--bad:#ff8a7d;--badbg:#3f1a17;--side:#091819;--sideink:#b6cfcd}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1a1b;--surface:#14262a;--surface2:#1b3236;--ink:#e6f0ef;--muted:#92aaab;--line:#27424a;--brand:#2fa39b;--brand-ink:#04201f;--accent:#f0b030;--ok:#5bd68a;--okbg:#12361f;--warn:#f0b030;--warnbg:#3a2c0a;--bad:#ff8a7d;--badbg:#3f1a17;--side:#091819;--sideink:#b6cfcd}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance}
h1{font-size:1.6rem}h2{font-size:1.15rem}h3{font-size:1rem}
.shell{display:grid;grid-template-columns:230px 1fr;height:100%}
.side{background:var(--side);color:var(--sideink);display:flex;flex-direction:column;padding:16px 10px;gap:4px;overflow-y:auto}
.logo{font-family:var(--fd);font-size:1.25rem;color:#fff;padding:4px 10px 12px;display:flex;flex-direction:column;gap:2px}
.logo small{font-family:var(--fb);font-size:.72rem;color:var(--sideink);opacity:.8}
.nav{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:500}
.nav:hover{background:rgba(255,255,255,.08)}
.nav.on{background:var(--accent);color:#1d1400;font-weight:700}
.nav:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bdg{background:var(--bad);color:#fff;border-radius:99px;font-size:.72rem;padding:1px 7px;font-weight:700}
.nav.on .bdg{background:#1d1400;color:var(--accent)}
.net{margin-top:auto;padding:10px 12px;font-size:.78rem;border-radius:8px;background:rgba(255,255,255,.07)}
.net b{display:block}
.main{overflow-y:auto;padding:20px 24px 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2,.card h3{margin-bottom:8px}
.kpi small{color:var(--muted);display:block}
.kpi b{font-family:var(--fd);font-size:1.5rem;display:block;margin-top:2px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:8px;cursor:pointer}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.acc{background:var(--accent);color:#1d1400;border-color:var(--accent)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:.84rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}
label{display:flex;flex-direction:column;gap:3px;font-size:.82rem;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input[type=checkbox]{width:auto}
.ck{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:500;font-size:.92rem}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
td.r,th.r{text-align:right}
tr.low td{background:var(--warnbg)}
.mesas{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.mesa{all:unset;box-sizing:border-box;cursor:pointer;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between}
.mesa:focus-visible{outline:2px solid var(--accent)}
.mesa b{font-family:var(--fd);font-size:1.2rem}
.mesa.occ{border-color:var(--accent);background:var(--warnbg)}
.kan{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col h3{display:flex;justify-content:space-between}
.ped{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.mb{position:fixed;inset:0;background:rgba(5,15,16,.55);display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow-y:auto;z-index:50}
.mb[hidden]{display:none}
.md{background:var(--bg);border-radius:14px;width:min(640px,100%);padding:18px;border:1px solid var(--line)}
.md.big{width:min(1100px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;max-height:48vh;overflow-y:auto;padding:2px}
.pb{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px;min-height:74px;justify-content:space-between}
.pb:hover{border-color:var(--accent)}.pb:focus-visible{outline:2px solid var(--accent)}
.pb span{color:var(--muted);font-size:.85rem}
.cmdgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.cats .btn.on{background:var(--brand);color:var(--brand-ink)}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:8px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:6px}
.qty input{width:70px;text-align:center}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:.75rem;color:var(--muted)}
.bar i{display:block;width:100%;background:var(--brand);border-radius:6px 6px 0 0;min-height:2px}
.bar i.neg{background:var(--accent)}
.hb{display:grid;grid-template-columns:150px 1fr 90px;gap:8px;align-items:center;font-size:.88rem;margin:5px 0}
.hb div{background:var(--surface2);border-radius:6px;height:14px;overflow:hidden}.hb div i{display:block;height:100%;background:var(--brand)}
.hb span:last-child{text-align:right}
.banner{padding:10px 14px;border-radius:10px;background:var(--warnbg);color:var(--warn);margin-bottom:14px;font-size:.9rem}
.chat{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow-y:auto;margin-bottom:10px}
.msg{padding:10px 12px;border-radius:12px;max-width:85%;white-space:pre-wrap}
.msg.u{background:var(--brand);color:var(--brand-ink);align-self:flex-end}.msg.a{background:var(--surface);border:1px solid var(--line)}
pre{white-space:pre-wrap;background:var(--surface2);padding:10px;border-radius:8px;font-size:.82rem;margin:0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:90;font-weight:600;max-width:90%}
#toast[hidden]{display:none}
.muted{color:var(--muted)}.right{margin-left:auto}
@media (max-width:900px){
 .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 .side{flex-direction:row;overflow-x:auto;padding:8px;align-items:center}.logo{display:none}.net{display:none}.nav{white-space:nowrap}
 .main{padding:14px 16px 60px}.cmdgrid{grid-template-columns:1fr}.hb{grid-template-columns:100px 1fr 80px}
}
@media (prefers-reduced-motion:no-preference){.btn,.pb,.mesa{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div class="shell">
 <nav class="side" id="nav" aria-label="Módulos"></nav>
 <main class="main" id="app"></main>
</div>
<div class="mb" id="mb" hidden><div class="md" id="md" role="dialog" aria-modal="true"></div></div>
<div class="mb" id="cf" hidden style="z-index:70"><div class="md" id="cfb"></div></div>
<div id="toast" hidden></div>
<script>
'use strict';
/* ===== Utilidades ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=s=>{s=String(s==null?'':s).trim();if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isNaN(n)?0:n};
const qf=n=>(+n).toLocaleString('pt-BR',{maximumFractionDigits:3});
const r2=n=>Math.round((+n||0)*100)/100;
const uid=()=>Math.random().toString(36).slice(2,9);
const dayKey=d=>new Date(d).toLocaleDateString('sv-SE');
const hhmm=d=>new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const dmy=d=>new Date(d).toLocaleDateString('pt-BR');
const mins=d=>Math.max(0,Math.round((Date.now()-new Date(d))/60000));
const FORMAS=['Dinheiro','Pix','Crédito','Débito','Vale-refeição','Online'];
const UFC={RO:11,AC:12,AM:13,RR:14,PA:15,AP:16,TO:17,MA:21,PI:22,CE:23,RN:24,PB:25,PE:26,AL:27,SE:28,BA:29,MG:31,ES:32,RJ:33,SP:35,PR:41,SC:42,RS:43,MS:50,MT:51,GO:52,DF:53};
const only=s=>String(s||'').replace(/\D/g,'');
function validaCPF(c){c=only(c);if(c.length!==11||/^(\d)\1+$/.test(c))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=+c[i]*(t+1-i);const d=(s*10)%11%10;if(d!==+c[t])return false}return true}
function validaCNPJ(c){c=only(c);if(c.length!==14||/^(\d)\1+$/.test(c))return false;const calc=n=>{let s=0,p=n-7;for(let i=0;i<n;i++){s+=+c[i]*p--;if(p<2)p=9}const r=s%11;return r<2?0:11-r};return calc(12)===+c[12]&&calc(13)===+c[13]}
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

/* ===== Estado e persistência ===== */
const LS='mesa_pronta_v1';
let S,ui={tab:'painel',cat:'Todos',q:'',cmd:null,pay:null,ed:null,dn:null,relPer:7,chat:[],storageOk:true,iaq:''};
function testStorage(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true}catch(e){return false}}
function load(){ui.storageOk=testStorage();if(ui.storageOk){try{const r=localStorage.getItem(LS);if(r){const o=JSON.parse(r);if(o&&o.v===1)return o}}catch(e){}}return seed()}
function save(){if(!ui.storageOk)return;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){ui.storageOk=false}}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}

/* ===== Domínio ===== */
const ins=id=>S.insumos.find(i=>i.id===id);
const prod=id=>S.produtos.find(p=>p.id===id);
function custoIns(i){if(i.receita&&i.receita.length&&i.rend>0){return i.receita.reduce((a,l)=>{const x=ins(l.id);return a+(x?l.qtd*custoIns(x):0)},0)/i.rend}return i.custo||0}
function custoProd(p){if(p.ficha&&p.ficha.length)return p.ficha.reduce((a,l)=>{const x=ins(l.id);return a+(x?l.qtd*custoIns(x):0)},0);return p.custoManual||0}
function baixa(itens,sign){ // sign=1 consome, -1 devolve
 itens.forEach(it=>{const p=prod(it.pid);if(!p||!p.ficha)return;p.ficha.forEach(l=>{const x=ins(l.id);if(x)x.estoque=r3(x.estoque-sign*l.qtd*it.qtd)})})}
const r3=n=>Math.round(n*1000)/1000;
function subtotal(itens){return r2(itens.reduce((a,i)=>{const p=prod(i.pid);return a+(p?p.preco*i.qtd:0)},0))}
function mkVenda(o){
 const itens=o.itens.map(i=>{const p=prod(i.pid);return{pid:p.id,nome:p.nome,qtd:i.qtd,preco:p.preco,custo:r2(custoProd(p))}});
 const sub=r2(itens.reduce((a,i)=>a+i.qtd*i.preco,0));
 const total=Math.max(0,r2(sub+(o.servico||0)-(o.desc||0)+(o.taxa||0)));
 const v={id:uid(),n:S.seq++,data:o.data||new Date().toISOString(),tipo:o.tipo,local:o.local||'',canal:o.canal||'',cliente:o.cliente||'',itens,sub,serv:o.servico||0,desc:o.desc||0,taxa:o.taxa||0,total,pagamentos:o.pagamentos,troco:o.troco||0,notaId:null};
 S.vendas.push(v);return v}
function dv11(s){let p=2,sum=0;for(let i=s.length-1;i>=0;i--){sum+=(+s[i])*p;p=p===9?2:p+1}const r=sum%11;return r<2?0:11-r}
function mkChave(n,dt){const c=S.cfg,d=new Date(dt);const aamm=String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0');
 const base=String(UFC[c.uf]||41)+aamm+only(c.cnpj).padStart(14,'0').slice(0,14)+'65'+String(c.serie).padStart(3,'0')+String(n).padStart(9,'0')+'1'+String(Math.floor(Math.random()*1e8)).padStart(8,'0');
 return base+dv11(base)}
function mkNota(v,doc,sim){
 const n=S.cfg.proxNum++;
 const nota={id:uid(),vendaId:v.id,numero:n,serie:S.cfg.serie,ambiente:S.cfg.ambiente,doc:only(doc),valor:v.total,data:v.data,status:'pendente',chave:'',protocolo:'',msg:''};
 S.notas.push(nota);v.notaId=nota.id;
 if(sim){nota.status='autorizada';nota.chave=mkChave(n,v.data);nota.protocolo='SIM'+Date.now().toString().slice(-9);nota.msg='Autorizada em simulação.'}
 return nota}
function payloadNota(nota){const v=S.vendas.find(x=>x.id===nota.vendaId),c=S.cfg;
 return{ambiente:c.ambiente==='producao'?1:2,modelo:65,serie:nota.serie,numero:nota.numero,emitente:{cnpj:only(c.cnpj),ie:c.ie,uf:c.uf,regime:c.regime,csc_id:c.cscId},
 destinatario:nota.doc?{documento:nota.doc}:null,
 itens:v.itens.map((i,k)=>{const p=prod(i.pid)||{};return{n:k+1,descricao:i.nome,ncm:p.ncm,cfop:p.cfop,csosn:p.csosn,unidade:p.tipo==='kg'?'KG':'UN',quantidade:i.qtd,valor_unitario:i.preco,valor_total:r2(i.qtd*i.preco)}}),
 pagamentos:v.pagamentos.map(g=>({forma:g.forma,valor:g.valor})),desconto:v.desc,acrescimos:r2(v.serv+v.taxa),total:v.total}}
async function transmitir(nota){
 const c=S.cfg;
 if(!navigator.onLine){nota.status='pendente';nota.msg='Sem internet: nota em contingência, será transmitida ao reconectar.';return}
 if(c.provedor==='simulado'){nota.status='autorizada';nota.chave=nota.chave||mkChave(nota.numero,nota.data);nota.protocolo='SIM'+Date.now().toString().slice(-9);nota.msg='Autorizada em simulação, sem valor fiscal.';return}
 try{
  const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.token},body:JSON.stringify(payloadNota(nota))});
  const j=await r.json().catch(()=>({}));
  if(r.ok&&(j.status==='autorizada'||j.chave)){nota.status='autorizada';nota.chave=j.chave||'';nota.protocolo=j.protocolo||'';nota.msg=j.mensagem||'Autorizada.'}
  else{nota.status='rejeitada';nota.msg=j.mensagem||('Rejeitada pelo provedor (HTTP '+r.status+').')}
 }catch(e){nota.status='pendente';nota.msg='Provedor inacessível: nota pendente de transmissão.'}
}
async function retryPend(){const p=S.notas.filter(n=>n.status==='pendente');for(const n of p)await transmitir(n);if(p.length){save();render();}}

/* ===== Dados de demonstração ===== */
function seed(){
 const I=(id,nome,un,est,min,custo,extra)=>Object.assign({id,nome,un,estoque:est,min,custo},extra||{});
 const insumos=[I('arroz','Arroz','kg',25,8,5.2),I('feijao','Feijão','kg',18,6,7.5),I('frango','Filé de frango','kg',12,5,18),I('carne','Carne bovina','kg',14,5,38),I('batata','Batata','kg',20,6,4.5),I('oleo','Óleo','l',10,3,8),I('cebola','Cebola','kg',8,3,4),I('tomate','Tomate','kg',6,3,7),I('alface','Alface','un',20,8,3),I('creme','Creme de leite','un',15,6,3.8),I('linguica','Linguiça','kg',7,3,24),I('bacon','Bacon','kg',3,1,32),I('farinha','Farinha de mandioca','kg',5,2,6),I('refri','Refrigerante lata','un',48,24,2.8),I('polpa','Polpa de fruta','kg',6,2,14),I('ovo','Ovo','un',60,24,.9),
  I('molho','Molho de tomate (preparo)','kg',4,2,0,{receita:[{id:'tomate',qtd:1},{id:'cebola',qtd:.2},{id:'oleo',qtd:.05}],rend:.9})];
 const P=(id,nome,cat,preco,ficha,extra)=>Object.assign({id,nome,cat,preco,ficha,tipo:'un',custoManual:0,ncm:'21069090',cfop:'5101',csosn:'102'},extra||{});
 const L=(...a)=>a.map(x=>({id:x[0],qtd:x[1]}));
 const produtos=[P('p1','Prato executivo de frango','Pratos',28.9,L(['arroz',.15],['feijao',.1],['frango',.18],['batata',.12],['alface',.5])),
  P('p2','Prato executivo de bife','Pratos',34.9,L(['arroz',.15],['feijao',.1],['carne',.2],['batata',.12],['oleo',.02])),
  P('p3','Strogonoff de frango','Pratos',32.9,L(['arroz',.15],['frango',.2],['creme',1],['molho',.05],['batata',.1])),
  P('p4','Feijoada completa','Pratos',42.9,L(['feijao',.25],['linguica',.1],['bacon',.05],['carne',.1],['arroz',.15],['farinha',.03])),
  P('p5','Parmegiana de frango','Pratos',36.9,L(['frango',.2],['molho',.1],['arroz',.15],['batata',.15])),
  P('p6','Omelete simples','Pratos',19.9,L(['ovo',3],['tomate',.05],['cebola',.03])),
  P('p7','Buffet por quilo','Buffet',69.9,L(['arroz',.25],['feijao',.15],['frango',.2],['carne',.1],['batata',.1],['alface',.5]),{tipo:'kg'}),
  P('p8','Refrigerante lata','Bebidas',6.5,L(['refri',1]),{cfop:'5102',ncm:'22021000'}),
  P('p9','Suco natural 300 ml','Bebidas',8.9,L(['polpa',.1]),{ncm:'20098900'}),
  P('p10','Água mineral','Bebidas',4.5,[],{custoManual:1.3,cfop:'5102',ncm:'22011000'}),

function caixaEsperado(){const c=S.caixa;if(!c.aberto)return 0;const ini=new Date(c.em);let d=c.abertura;S.vendas.filter(v=>new Date(v.data)>=ini).forEach(v=>v.pagamentos.filter(p=>p.forma==='Dinheiro').forEach(p=>d+=p.valor));c.movs.forEach(m=>d+=m.tipo==='suprimento'?m.valor:-m.valor);return r2(d)}

function vRelatorios(){

 const cats=['Todos',...new Set(S.produtos.map(p=>p.cat))];const sub=subtotal(c.itens);const naoEnv=c.itens.filter(i=>!i.env).length;
 showModal(`<div class="mh"><h2>${esc(c.local)} <span class="muted" style="font-size:.9rem">aberta há ${mins(c.aberta)} min</span></h2><button class="btn sm" data-act="close">Fechar janela</button></div>
 <div class="cmdgrid"><div><input id="pq" data-inp="q" placeholder="Buscar produto" value="${esc(ui.q)}" style="margin-bottom:8px"><div class="cats">${cats.map(k=>`<button class="btn sm ${ui.cat===k?'on':''}" data-act="cat" data-k="${esc(k)}">${esc(k)}</button>`).join('')}</div><div class="pg" id="pgrid">${gridHtml()}</div></div>

 <input value="${esc(it.obs||'')}" data-chg="obs" data-k="${k}" placeholder="Observação (ex.: sem cebola)" style="grid-column:1/-1"></div>`}).join('')||'<p class="muted">Toque em um produto para lançar.</p>'}

 <div class="row"><button class="btn" data-act="sendk" ${naoEnv?'':'disabled'}>Enviar à cozinha (${naoEnv})</button><button class="btn" data-act="prec">Copiar pré-conta</button><button class="btn pri" data-act="fechar" ${c.itens.length?'':'disabled'}>Fechar conta</button><button class="btn bad" data-act="cancmd">Cancelar</button></div></div></div>`,true)}

/* ===== Pagamento ===== */
const refSrc=r=>r.kind==='cmd'?S.comandas.find(c=>c.id===r.id):S.delivery.find(d=>d.id===r.id);
function payCalc(){const p=ui.pay,src=refSrc(p.ref),sub=subtotal(src.itens),serv=p.servico?r2(sub*S.cfg.servicoPct/100):0,bruto=sub+serv,desc=r2(Math.min(bruto,p.dtipo==='%'?sub*p.dval/100:p.dval)),taxa=p.ref.kind==='del'?src.taxa:0,total=r2(bruto-desc+taxa),pago=r2(soma(p.pags,g=>g.valor));return{src,sub,serv,desc,taxa,total,pago,falta:r2(total-pago)}}
function openPay(ref){const src=refSrc(ref);const sal=ref.kind==='cmd'&&src.mesa;ui.pay={ref,servico:!!sal&&S.cfg.servicoPct>0,dtipo:'R$',dval:0,pags:[],emitir:false,doc:'',pessoas:src.pessoas||1};
 if(ref.kind==='del'){const k=payCalc();ui.pay.pags=[{forma:src.forma,valor:k.total}]}drawPay()}
function drawPay(){const p=ui.pay,k=payCalc();
 showModal(`${mh('Fechar conta · '+esc(k.src.local||k.src.cliente||''))}
 <div class="card"><div class="row"><span>Subtotal</span><b class="right">${money(k.sub)}</b></div>
 <label class="ck" style="margin:6px 0"><input type="checkbox" id="psv" data-chg="pserv" ${p.servico?'checked':''}> Taxa de serviço ${S.cfg.servicoPct}% (${money(k.serv)})</label>
 <div class="row" style="margin:6px 0"><span>Desconto</span><select data-chg="pdt" style="width:80px"><option ${p.dtipo==='R$'?'selected':''}>R$</option><option ${p.dtipo==='%'?'selected':''}>%</option></select><input value="${p.dval?String(p.dval).replace('.',','):''}" data-chg="pdv" inputmode="decimal" style="width:100px" placeholder="0"><span class="right muted">-${money(k.desc)}</span></div>
 ${k.taxa?`<div class="row"><span>Taxa de entrega</span><b class="right">${money(k.taxa)}</b></div>`:''}
 <div class="row" style="font-size:1.3rem"><b>Total</b><b class="right">${money(k.total)}</b></div>
 ${ui.pay.ref.kind==='cmd'?`<div class="row muted" style="margin-top:4px"><span>Dividir por</span><input value="${p.pessoas}" data-chg="ppes" style="width:60px" inputmode="numeric"><span>pessoas: ${money(k.total/Math.max(1,p.pessoas))} cada</span></div>`:''}</div>
 <div class="card" style="margin-top:10px"><h3>Pagamento</h3>${p.pags.map((g,i)=>`<div class="row" style="margin:4px 0"><span>${esc(g.forma)}</span><b>${money(g.valor)}</b><button class="btn sm bad right" data-act="rmpag" data-k="${i}">remover</button></div>`).join('')||'<p class="muted">Nenhum pagamento lançado.</p>'}
 <p style="margin:8px 0"><b>${k.falta>0.005?'Falta '+money(k.falta):k.falta<-0.005?'Troco '+money(-k.falta):'Conta quitada'}</b></p>
 ${k.falta>0.005?`<div class="row">${FORMAS.map(f=>`<button class="btn sm" data-act="payfull" data-f="${f}">Restante em ${f}</button>`).join('')}</div>
 <div class="row" style="margin-top:8px"><select id="pf" style="width:150px">${FORMAS.map(f=>`<option>${f}</option>`).join('')}</select><input id="pv" placeholder="Valor" inputmode="decimal" style="width:120px"><button class="btn sm" data-act="payadd">Lançar valor</button></div>`:''}</div>
 <div class="card" style="margin-top:10px"><label class="ck"><input type="checkbox" data-chg="pemit" ${p.emitir?'checked':''}> Emitir NFC-e nesta venda</label>${p.emitir?`<label style="margin-top:8px">CPF ou CNPJ na nota (opcional)<input value="${esc(p.doc)}" data-chg="pdoc" inputmode="numeric" placeholder="Somente números"></label>`:''}</div>
 <div class="row" style="margin-top:12px"><button class="btn pri" data-act="confpay" ${k.falta>0.005?'disabled':''}>Confirmar recebimento</button><button class="btn" data-act="prec2">Copiar pré-conta</button></div>`)}
async function confirmPay(){const p=ui.pay,k=payCalc();
 if(!S.caixa.aberto)return toast('Abra o caixa em Financeiro antes de receber.');
 if(k.falta>0.005)return toast('Ainda falta '+money(k.falta));
 if(p.emitir&&p.doc&&!(validaCPF(p.doc)||validaCNPJ(p.doc)))return toast('CPF ou CNPJ inválido.');
 let troco=r2(-k.falta),pags=p.pags.map(g=>({...g}));
 if(troco>0.005){const din=soma(pags.filter(g=>g.forma==='Dinheiro'),g=>g.valor);if(din<troco)return toast('O troco só pode sair de pagamento em dinheiro.');let rest=troco;pags.forEach(g=>{if(g.forma==='Dinheiro'&&rest>0){const t=Math.min(g.valor,rest);g.valor=r2(g.valor-t);rest=r2(rest-t)}});pags=pags.filter(g=>g.valor>0)}else troco=0;
 const src=k.src,del=p.ref.kind==='del';
 const v=mkVenda({tipo:del?'delivery':src.mesa?'salao':'balcao',itens:src.itens.map(i=>({pid:i.pid,qtd:i.qtd})),local:src.local||'',canal:src.canal||'',cliente:src.cliente||'',servico:k.serv,desc:k.desc,taxa:k.taxa,pagamentos:pags,troco});
 if(!del){baixa(src.itens,1);S.comandas=S.comandas.filter(c=>c.id!==src.id)}else{if(!src.baixado){baixa(src.itens,1);src.baixado=true}src.status='entregue';src.vendaId=v.id}
 let nota=null;if(p.emitir){nota=mkNota(v,p.doc,false);await transmitir(nota)}

/* ===== Assistente ===== */
function answer(q){const t=norm(q);
 const per=/ontem/.test(t)?'ontem':/semana|7 dias/.test(t)?'semana':/mes|30 dias/.test(t)?'mes':'hoje';
 const get=()=>{if(per==='ontem'){const k=dayKey(Date.now()-864e5);return S.vendas.filter(v=>dayKey(v.data)===k)}return per==='hoje'?vendasHoje():per==='semana'?vendasDias(7):vendasDias(30)};
 const lab={hoje:'hoje',ontem:'ontem',semana:'nos últimos 7 dias',mes:'nos últimos 30 dias'}[per];
 if(/ticket/.test(t)){const v=get();return`Ticket médio ${lab}: ${money(v.length?soma(v,x=>x.total)/v.length:0)} em ${v.length} vendas.`}
 if(/mais vendid|top|campea|popular/.test(t)){const tp=topProdutos(get()).sort((a,b)=>b.qtd-a.qtd).slice(0,3);return tp.length?`Mais vendidos ${lab}:\n`+tp.map((x,i)=>`${i+1}. ${x.nome}: ${qf(x.qtd)} (${money(x.rec)})`).join('\n'):'Sem vendas no período.'}
 if(/estoque|insumo|acabando|falta/.test(t)){const b=baixos();return b.length?'Insumos no mínimo ou abaixo:\n'+b.map(i=>`${i.nome}: ${qf(i.estoque)} ${i.un} (mínimo ${qf(i.min)})`).join('\n'):'Nenhum insumo abaixo do mínimo.'}
 if(/pagar|vence|conta|boleto/.test(t)){const lim=dayKey(Date.now()+7*864e5);const c=S.contas.filter(a=>!a.pago&&a.venc<=lim).sort((a,b)=>a.venc.localeCompare(b.venc));return c.length?'Contas até 7 dias:\n'+c.map(a=>`${dmy(a.venc+'T12:00')} · ${a.tipo==='pagar'?'pagar':'receber'} · ${a.desc} · ${money(a.valor)}`).join('\n'):'Nenhuma conta nos próximos 7 dias.'}
 if(/margem|lucro|cmv|custo/.test(t)){const l=S.produtos.map(p=>({p,m:p.preco?(p.preco-custoProd(p))/p.preco*100:0})).sort((a,b)=>a.m-b.m);return'Menores margens do cardápio:\n'+l.slice(0,4).map(x=>`${x.p.nome}: ${x.m.toFixed(0)}% (custo ${money(custoProd(x.p))} / preço ${money(x.p.preco)})`).join('\n')}
 if(/delivery|entrega|ifood/.test(t)){const a=S.delivery.filter(d=>!['entregue','cancelado'].includes(d.status));return`Delivery em andamento: ${a.length}. `+DEL_ST.slice(0,4).map(([k,n])=>`${n}: ${a.filter(d=>d.status===k).length}`).join(', ')+'.'}
 if(/nota|nfc|fiscal/.test(t)){const p=notasPend();return p.length?`Há ${p.length} nota(s) pendentes ou rejeitadas. Veja a aba Fiscal.`:'Nenhuma nota pendente ou rejeitada.'}
 if(/caixa|gaveta/.test(t))return S.caixa.aberto?`Caixa aberto. Dinheiro esperado na gaveta: ${money(caixaEsperado())}.`:'O caixa está fechado.';
 if(/fatur|vend|receita|quanto/.test(t)){const v=get();return`Faturamento ${lab}: ${money(soma(v,x=>x.total))} em ${v.length} vendas. CMV ${money(soma(v,cmv))}.`}
 return'Não entendi. Pergunte sobre faturamento, ticket médio, mais vendidos, estoque baixo, contas a vencer, margem, delivery, notas ou caixa.'}

 abrecaixa(){S.caixa={aberto:true,abertura:num($('#abv').value),em:new Date().toISOString(),movs:[]};save();render()},
 mvcaixa(d){showModal(mh(d.t==='sangria'?'Sangria':'Suprimento')+`<div class="form">${field('Valor (R$)','mc_v','','inputmode="decimal"')}${field('Motivo','mc_m','')}</div><div class="row" style="margin-top:10px"><button class="btn pri" data-act="mcsave" data-t="${d.t}">Registrar</button></div>`)},
 mcsave(d){const v=num($('#mc_v').value);if(v<=0)return toast('Informe o valor.');S.caixa.movs.push({tipo:d.t,valor:v,motivo:$('#mc_m').value,data:new Date().toISOString()});save();hideModal()},
 fechacaixa(){showModal(mh('Fechar caixa')+`<p>Dinheiro esperado: <b>${money(caixaEsperado())}</b></p>${field('Dinheiro contado na gaveta (R$)','fc_v','','inputmode="decimal"')}<div class="row" style="margin-top:10px"><button class="btn pri" data-act="fcsave">Fechar caixa</button></div>`)},
 fcsave(){const c=num($('#fc_v').value),e=caixaEsperado();S.caixaHist.push({em:S.caixa.em,fim:new Date().toISOString(),esperado:e,contado:c,dif:r2(c-e)});S.caixa.aberto=false;save();hideModal()},
 addconta(){const v=num($('#cn_v').value),dsc=$('#cn_d').value.trim();if(!dsc||v<=0)return toast('Informe descrição e valor.');S.contas.push({id:uid(),tipo:$('#cn_t').value,desc:dsc,valor:v,venc:$('#cn_venc').value||dayKey(Date.now()),pago:false});save();render()},
 baixarconta(d){const c=S.contas.find(x=>x.id===d.id);c.pago=true;c.pagoEm=dayKey(Date.now());save();render()},
 /* fiscal */
 async reenviar(d){const n=S.notas.find(x=>x.id===d.id);n.status='pendente';await transmitir(n);save();render()},
 cancnota(d){showModal(mh('Cancelar NFC-e')+`<label>Justificativa (mínimo de 15 caracteres)<input id="cj" placeholder="Ex.: erro de digitação no valor da venda"></label><div class="row" style="margin-top:10px"><button class="btn bad" data-act="cancok" data-id="${d.id}">Cancelar nota</button></div>`)},
 cancok(d){const j=$('#cj').value.trim();if(j.length<15)return toast('A justificativa precisa ter ao menos 15 caracteres.');const n=S.notas.find(x=>x.id===d.id);n.status='cancelada';n.msg='Cancelada: '+j;save();hideModal();toast('Nota cancelada (simulação local).')},
 emitirvenda(d){showModal(mh('Emitir NFC-e')+`${field('CPF ou CNPJ na nota (opcional)','ev_doc','','inputmode="numeric"')}<div class="row" style="margin-top:10px"><button class="btn pri" data-act="evok" data-id="${d.id}">Emitir</button></div>`)},
 async evok(d){const doc=$('#ev_doc').value;if(doc&&!(validaCPF(doc)||validaCNPJ(doc)))return toast('CPF ou CNPJ inválido.');const v=S.vendas.find(x=>x.id===d.id);const n=mkNota(v,doc,false);await transmitir(n);save();hideModal();toast('NFC-e '+n.status+'.')},
 per(d){ui.relPer=+d.n;render()},
 ask(d){ui.chat.push({r:'u',t:d.q},{r:'a',t:answer(d.q)});render()},
 askin(){const q=$('#iaq').value.trim();if(!q)return;ui.iaq='';ui.chat.push({r:'u',t:q},{r:'a',t:answer(q)});render();$('#iaq')?.focus()},
 zerar(){askConfirm('Apagar vendas, notas, pedidos e contas? Produtos, insumos e fichas são mantidos.',()=>{S.vendas=[];S.notas=[];S.delivery=[];S.comandas=[];S.contas=[];S.producao=[];S.movEst=[];S.caixaHist=[];S.seq=1;S.cfg.proxNum=1;save();render();toast('Dados operacionais limpos.')})},
 resetall(){askConfirm('Restaurar todos os dados de demonstração? Suas alterações serão perdidas.',()=>{S=seed();save();render()})},
 backup(){copyText(JSON.stringify(S))},
 restaurar(){try{const o=JSON.parse($('#bk').value);if(!o||o.v!==1||!o.produtos)throw 0;S=o;save();render();toast('Backup restaurado.')}catch(e){toast('Texto de backup inválido.')}}
};
const CH={
 cfg(v,d){S.cfg[d.k]=v;save();if(d.k==='nome')renderNav()},
 cfgn(v,d){S.cfg[d.k]=num(v);if(d.k==='mesas')S.cfg.mesas=Math.max(1,Math.min(60,Math.round(num(v))));save()},
 kg(v,d){const c=curCmd();c.itens[+d.k].qtd=Math.max(0.01,num(v));save();drawCmd()},
 obs(v,d){curCmd().itens[+d.k].obs=v;save()},
 pessoas(v){curCmd().pessoas=Math.max(1,Math.round(num(v))||1);save()},
 pserv(v,d,el){ui.pay.servico=el.checked;drawPay()},
 pdt(v){ui.pay.dtipo=v;drawPay()},
 pdv(v){ui.pay.dval=Math.max(0,num(v));drawPay()},
 ppes(v){ui.pay.pessoas=Math.max(1,Math.round(num(v))||1);drawPay()},
 pemit(v,d,el){ui.pay.emitir=el.checked;drawPay()},
 pdoc(v){ui.pay.doc=v},
 edprep(v,d,el){syncEd();ui.ed.d.prep=el.checked;if(el.checked&&!ui.ed.d.receita)ui.ed.d.receita=[];drawEd()}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f)f(t.dataset,t,e)});
document.addEventListener('change',e=>{const t=e.target.closest('[data-chg]');if(!t)return;const f=CH[t.dataset.chg];if(f){f(t.type==='checkbox'?t.checked:t.value,t.dataset,t)}});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.inp==='q'){ui.q=e.target.value;const g=$('#pgrid');if(g)g.innerHTML=gridHtml()}if(e.target.id==='iaq')ui.iaq=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='iaq')A.askin();if(e.key==='Escape'){if(!$('#cf').hidden)A.cfno();else if(!$('#mb').hidden)hideModal()}});
window.addEventListener('online',()=>{renderNav();retryPend();toast('Conexão restabelecida.')});
window.addEventListener('offline',()=>{renderNav();toast('Sem internet: o sistema segue funcionando.')});
setInterval(()=>{if($('#mb').hidden&&['painel','salao','cozinha','delivery'].includes(ui.tab)&&!document.activeElement.matches('input,select,textarea'))render()},30000);
S=load();save();render();retryPend();

</script>
</body>
</html>
