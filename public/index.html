<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesa Pronta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: barra lateral escura + área de trabalho clara; módulos operados por abas, cartões densos */
:root{--bg:#f2f5f6;--surface:#fff;--surface2:#eaf0f1;--ink:#14282a;--muted:#5d7173;--line:#d5dfe1;--brand:#0f4c4a;--brand-ink:#fff;--accent:#d98e04;--ok:#17803d;--okbg:#e0f3e6;--warn:#a86a00;--warnbg:#fdf0d0;--bad:#b42318;--badbg:#fde4e1;--side:#0c2f2e;--sideink:#cfe3e1;
--fd:'Bricolage Grotesque',system-ui,sans-serif;--fb:'Hanken Grotesk',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d1a1b;--surface:#14262a;--surface2:#1b3236;--ink:#e6f0ef;--muted:#92aaab;--line:#27424a;--brand:#2fa39b;--brand-ink:#04201f;--accent:#f0b030;--ok:#5bd68a;--okbg:#12361f;--warn:#f0b030;--warnbg:#3a2c0a;--bad:#ff8a7d;--badbg:#3f1a17;--side:#091819;--sideink:#b6cfcd}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1a1b;--surface:#14262a;--surface2:#1b3236;--ink:#e6f0ef;--muted:#92aaab;--line:#27424a;--brand:#2fa39b;--brand-ink:#04201f;--accent:#f0b030;--ok:#5bd68a;--okbg:#12361f;--warn:#f0b030;--warnbg:#3a2c0a;--bad:#ff8a7d;--badbg:#3f1a17;--side:#091819;--sideink:#b6cfcd}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance}
h1{font-size:1.6rem}h2{font-size:1.15rem}h3{font-size:1rem}
.shell{display:grid;grid-template-columns:230px 1fr;height:100%}
.side{background:var(--side);color:var(--sideink);display:flex;flex-direction:column;padding:16px 10px;gap:4px;overflow-y:auto}
.logo{font-family:var(--fd);font-size:1.25rem;color:#fff;padding:4px 10px 12px;display:flex;flex-direction:column;gap:2px}
.logo small{font-family:var(--fb);font-size:.72rem;color:var(--sideink);opacity:.8}
.nav{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:500}
.nav:hover{background:rgba(255,255,255,.08)}
.nav.on{background:var(--accent);color:#1d1400;font-weight:700}
.nav:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bdg{background:var(--bad);color:#fff;border-radius:99px;font-size:.72rem;padding:1px 7px;font-weight:700}
.nav.on .bdg{background:#1d1400;color:var(--accent)}
.net{margin-top:auto;padding:10px 12px;font-size:.78rem;border-radius:8px;background:rgba(255,255,255,.07)}
.net b{display:block}
.main{overflow-y:auto;padding:20px 24px 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2,.card h3{margin-bottom:8px}
.kpi small{color:var(--muted);display:block}
.kpi b{font-family:var(--fd);font-size:1.5rem;display:block;margin-top:2px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:8px;cursor:pointer}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.acc{background:var(--accent);color:#1d1400;border-color:var(--accent)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:.84rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}
label{display:flex;flex-direction:column;gap:3px;font-size:.82rem;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input[type=checkbox]{width:auto}
.ck{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:500;font-size:.92rem}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
td.r,th.r{text-align:right}
tr.low td{background:var(--warnbg)}
.mesas{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.mesa{all:unset;box-sizing:border-box;cursor:pointer;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between}
.mesa:focus-visible{outline:2px solid var(--accent)}
.mesa b{font-family:var(--fd);font-size:1.2rem}
.mesa.occ{border-color:var(--accent);background:var(--warnbg)}.mesa.conta{border-color:var(--bad);box-shadow:0 0 0 2px var(--badbg)}.mesa small{font-size:.78rem}
.kan{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col h3{display:flex;justify-content:space-between}
.ped{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.mb{position:fixed;inset:0;background:rgba(5,15,16,.55);display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow-y:auto;z-index:50}
.mb[hidden]{display:none}
.md{background:var(--bg);border-radius:14px;width:min(640px,100%);padding:18px;border:1px solid var(--line)}
.md.big{width:min(1100px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;max-height:48vh;overflow-y:auto;padding:2px}
.pb{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px;min-height:74px;justify-content:space-between}
.pb:hover{border-color:var(--accent)}.pb:focus-visible{outline:2px solid var(--accent)}
.pb span{color:var(--muted);font-size:.85rem}
.cmdgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.cats .btn.on{background:var(--brand);color:var(--brand-ink)}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:8px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:6px}
.qty input{width:70px;text-align:center}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:.75rem;color:var(--muted)}
.bar i{display:block;width:100%;background:var(--brand);border-radius:6px 6px 0 0;min-height:2px}
.bar i.neg{background:var(--accent)}
.hb{display:grid;grid-template-columns:150px 1fr 90px;gap:8px;align-items:center;font-size:.88rem;margin:5px 0}
.hb div{background:var(--surface2);border-radius:6px;height:14px;overflow:hidden}.hb div i{display:block;height:100%;background:var(--brand)}
.hb span:last-child{text-align:right}
.banner{padding:10px 14px;border-radius:10px;background:var(--warnbg);color:var(--warn);margin-bottom:14px;font-size:.9rem}
.chat{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow-y:auto;margin-bottom:10px}
.msg{padding:10px 12px;border-radius:12px;max-width:85%;white-space:pre-wrap}
.msg.u{background:var(--brand);color:var(--brand-ink);align-self:flex-end}.msg.a{background:var(--surface);border:1px solid var(--line)}
pre{white-space:pre-wrap;background:var(--surface2);padding:10px;border-radius:8px;font-size:.82rem;margin:0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:90;font-weight:600;max-width:90%}
#toast[hidden]{display:none}
.muted{color:var(--muted)}.right{margin-left:auto}
@media (max-width:900px){
 .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 .side{flex-direction:row;overflow-x:auto;padding:8px;align-items:center}.logo{display:none}.net{display:none}.nav{white-space:nowrap}
 .main{padding:14px 16px 60px}.cmdgrid{grid-template-columns:1fr}.hb{grid-template-columns:100px 1fr 80px}
}
@media (prefers-reduced-motion:no-preference){.btn,.pb,.mesa{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div class="shell">
 <nav class="side" id="nav" aria-label="Módulos"></nav>
 <main class="main" id="app"></main>
</div>
<div class="mb" id="mb" hidden><div class="md" id="md" role="dialog" aria-modal="true"></div></div>
<div class="mb" id="cf" hidden style="z-index:70"><div class="md" id="cfb"></div></div>
<div class="mb" id="login" hidden style="z-index:100;background:var(--bg)"></div>
<div id="toast" hidden></div>
<script src="config.js"></script>
<script>
'use strict';
/* ===== Utilidades ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=s=>{s=String(s==null?'':s).trim();if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?n:0};
const qf=n=>(+n).toLocaleString('pt-BR',{maximumFractionDigits:3});
/* ===== Dinheiro em centavos inteiros — critério ÚNICO de arredondamento =====
   Todo valor monetário é calculado em centavos inteiros e arredondado UMA vez por operação,
   sempre pelo mesmo critério: metade para longe do zero (arredondamento comercial), com tolerância
   de ponto flutuante (EPS) para que 1,005 vire 1,01 e não 1,00. Os valores gravados continuam em reais
   (com 2 casas), para compatibilidade com os dados e o servidor. Divisões em partes (rateio, ex.: gorjeta)
   usam o método do maior resto, que fecha exatamente o total em centavos. */
const EPS=1e-7;
const rc=x=>{x=+x||0;if(!isFinite(x))return 0;return x<0?-Math.floor(-x+0.5+EPS):Math.floor(x+0.5+EPS)}; /* fração de centavo → centavo inteiro */
const toC=v=>rc((+v||0)*100);            /* reais → centavos inteiros */
const fromC=c=>c/100;                    /* centavos inteiros → reais */
const r2=n=>fromC(toC(n));               /* arredonda reais a 2 casas pelo critério único */
const linhaC=(preco,qtd)=>rc(toC(preco)*(+qtd||0)); /* valor da linha (preço × quantidade) em centavos */
const pctC=(c,p)=>rc(c*(+p||0)/100);     /* percentual sobre centavos, arredondado uma vez */
const uid=()=>Math.random().toString(36).slice(2,9);
const dayKey=d=>new Date(d).toLocaleDateString('sv-SE');
const hhmm=d=>new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const dmy=d=>new Date(d).toLocaleDateString('pt-BR');
const mins=d=>Math.max(0,Math.round((Date.now()-new Date(d))/60000));
const FORMAS=['Dinheiro','Pix','Crédito','Débito','Vale-refeição','Online'];
const UFC={RO:11,AC:12,AM:13,RR:14,PA:15,AP:16,TO:17,MA:21,PI:22,CE:23,RN:24,PB:25,PE:26,AL:27,SE:28,BA:29,MG:31,ES:32,RJ:33,SP:35,PR:41,SC:42,RS:43,MS:50,MT:51,GO:52,DF:53};
const only=s=>String(s||'').replace(/\D/g,'');
function validaCPF(c){c=only(c);if(c.length!==11||/^(\d)\1+$/.test(c))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=+c[i]*(t+1-i);const d=(s*10)%11%10;if(d!==+c[t])return false}return true}
const cnpjLimpo=s=>String(s==null?'':s).toUpperCase().replace(/[^0-9A-Z]/g,'');
const docLimpo=cnpjLimpo; /* CPF (11 dígitos) ou CNPJ (14 caracteres, alfanumérico a partir de 2026) */
const valCar=ch=>ch.charCodeAt(0)-48; /* regra da Receita Federal: código ASCII menos 48 ('0'=0 ... '9'=9, 'A'=17 ... 'Z'=42) */
function dvCnpj(base){const dv=(s,w)=>{let t=0;for(let i=0;i<w.length;i++)t+=valCar(s[i])*w[i];const r=t%11;return r<2?0:11-r};const d1=dv(base,[5,4,3,2,9,8,7,6,5,4,3,2]);const d2=dv(base+d1,[6,5,4,3,2,9,8,7,6,5,4,3,2]);return''+d1+d2}
function validaCNPJ(c){c=cnpjLimpo(c);if(!/^[0-9A-Z]{12}[0-9]{2}$/.test(c)||/^(.)\1+$/.test(c))return false;return dvCnpj(c.slice(0,12))===c.slice(12)}
function fmtCNPJ(s){const c=cnpjLimpo(s);return c.length===14?`${c.slice(0,2)}.${c.slice(2,5)}.${c.slice(5,8)}/${c.slice(8,12)}-${c.slice(12)}`:String(s||'')}
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

/* ===== Estado e persistência ===== */
const LS='mesa_pronta_v1';
let S,ui={user:null,pdv:null,pdvNfce:false,eu:null,fails:0,lockUntil:0,last:Date.now(),tab:'painel',cat:'Todos',q:'',cmd:null,pay:null,ed:null,dn:null,relPer:7,chat:[],storageOk:true,iaq:''};
function testStorage(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true}catch(e){return false}}
function migra(o){o.users=o.users||defaultUsers();o.audit=o.audit||[];if(!o.mesas)o.mesas=Array.from({length:Math.max(0,Math.min(60,+o.cfg.mesas||0))},(_,i)=>mkMesa(i+1));o.gorjEquipe=o.gorjEquipe||[];o.gorjLanc=o.gorjLanc||[];o.gorjFech=o.gorjFech||[];o.cfg.gorj=o.cfg.gorj||gorjDef(o.cfg.regime);o.cfg.fisc=o.cfg.fisc||fiscDef();o.cfg.bloqueioMin=o.cfg.bloqueioMin||10;const used=new Set();o.produtos.forEach((p,i)=>{if(!p.cod||used.has(p.cod)){let n=101+i;while(used.has(String(n)))n++;p.cod=String(n)}used.add(p.cod)});return o}
function load(){ui.storageOk=testStorage();if(ui.storageOk){try{const r=localStorage.getItem(LS);if(r){const o=JSON.parse(r);if(o&&o.v===1)return migra(o)}}catch(e){}}return seed()}
function save(){if(CLOUD()){cloudSaved();return}if(!ui.storageOk)return;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){ui.storageOk=false}}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}

/* ===== Controle de acesso ===== */
const sha256=(()=>{const K=[],H0=[];let c=0;for(let n=2;c<64;n++){let p=true;for(let d=2;d*d<=n;d++)if(n%d===0){p=false;break}if(!p)continue;if(c<8)H0.push(Math.floor((Math.sqrt(n)%1)*4294967296));K.push(Math.floor((Math.cbrt(n)%1)*4294967296));c++}
 const R=(x,n)=>(x>>>n)|(x<<(32-n));
 return s=>{const b=new TextEncoder().encode(s),l=b.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(b);m[l]=128;const dv=new DataView(m.buffer);dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l*8/4294967296));const H=H0.slice(),w=new Array(64);
 for(let i=0;i<n;i+=64){for(let t=0;t<16;t++)w[t]=dv.getUint32(i+t*4);for(let t=16;t<64;t++){const a=w[t-15],b2=w[t-2];w[t]=(w[t-16]+(R(a,7)^R(a,18)^(a>>>3))+w[t-7]+(R(b2,17)^R(b2,19)^(b2>>>10)))>>>0}
  let [a,b3,c2,d,e,f,g,h]=H;for(let t=0;t<64;t++){const t1=(h+(R(e,6)^R(e,11)^R(e,25))+((e&f)^(~e&g))+K[t]+w[t])>>>0,t2=((R(a,2)^R(a,13)^R(a,22))+((a&b3)^(a&c2)^(b3&c2)))>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c2;c2=b3;b3=a;a=(t1+t2)>>>0}
  H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b3)>>>0;H[2]=(H[2]+c2)>>>0;H[3]=(H[3]+d)>>>0;H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0}
 return H.map(x=>x.toString(16).padStart(8,'0')).join('')}})();
const hashPin=(id,pin)=>sha256('mp:'+id+':'+pin);
const PERFIS={dono:{nome:'Proprietário',tabs:'*',can:'*'},
 gerente:{nome:'Gerente',tabs:['painel','pdv','salao','delivery','cozinha','produtos','estoque','producao','financeiro','fiscal','relatorios','assistente','acesso'],can:['desconto','cancelar','sangria','cancnota','fechacaixa','contas','ajusteest','mesas']},
 caixa:{nome:'Operador de caixa',tabs:['pdv','salao','delivery','financeiro','fiscal'],can:['fechacaixa']},
 garcom:{nome:'Garçom',tabs:['salao','cozinha'],can:[]},
 cozinha:{nome:'Cozinha',tabs:['cozinha','estoque','producao'],can:['ajusteest']}};
const ACOES={desconto:'dar desconto',cancelar:'cancelar item, comanda ou pedido',sangria:'registrar sangria',cancnota:'cancelar NFC-e',fechacaixa:'fechar o caixa',contas:'ver contas a pagar e receber',ajusteest:'ajustar estoque',mesas:'gerenciar mesas'};
const PERM_TXT={desconto:'Dar desconto',cancelar:'Cancelar itens e pedidos',sangria:'Sangria',cancnota:'Cancelar NFC-e',contas:'Ver contas a pagar',ajusteest:'Perdas e contagem de estoque',mesas:'Cadastrar e excluir mesas',usuarios:'Gerenciar usuários'};
const canP=(perfil,a)=>{const p=PERFIS[perfil];if(!p)return false;if(a==='usuarios'||a==='regragorj'||a==='padraofisc')return perfil==='dono';return p.can==='*'||p.can.includes(a)};
const can=a=>!!ui.user&&canP(ui.user.perfil,a);
const tabOk=t=>!!ui.user&&(PERFIS[ui.user.perfil].tabs==='*'||PERFIS[ui.user.perfil].tabs.includes(t));
function mkUser(nome,perfil,pin){const id=uid();return{id,nome,perfil,pinHash:hashPin(id,pin),ativo:true,pinPadrao:true,ultimo:''}}
function defaultUsers(){return[mkUser('Proprietário','dono','1234'),mkUser('Gerente','gerente','2345'),mkUser('Caixa 1','caixa','3456'),mkUser('Garçom 1','garcom','4567')]}
function logA(acao,det){if(!S)return;S.audit.push({data:new Date().toISOString(),user:ui.user?ui.user.nome:'-',acao,det:det||''});if(S.audit.length>600)S.audit=S.audit.slice(-500)}

/* ===== Domínio ===== */
const ins=id=>S.insumos.find(i=>i.id===id);
const prod=id=>S.produtos.find(p=>p.id===id);
function custoIns(i,vis){vis=vis||new Set();if(vis.has(i.id)){ui.ciclo=true;return 0} /* referência circular: não trava, custo do trecho = 0 e o ciclo é sinalizado */
 vis.add(i.id);if(i.receita&&i.receita.length&&i.rend>0){return i.receita.reduce((a,l)=>{const x=ins(l.id);return a+(x?l.qtd*custoIns(x,new Set(vis)):0)},0)/i.rend}return i.custo||0}
/* Detecção de ciclo em receitas: devolve os nomes do caminho (A → B → A) se o preparo `id`, com as linhas `linhas`, voltar a si mesmo; senão null */
function cicloDe(id,linhas){const seen=new Set(),me=ins(id)||{id,nome:'este preparo',receita:[]};
 const dfs=(x,path)=>{for(const l of(x.id===id?linhas:(x.receita||[]))){const y=ins(l.id);if(!y)continue;if(y.id===id)return[...path,y.nome];if(seen.has(y.id))continue;seen.add(y.id);const r=dfs(y,[...path,y.nome]);if(r)return r}return null};
 return dfs(me,[me.nome])}
function detectaCiclos(){const out=[],ks=new Set();(S.insumos||[]).forEach(i=>{if(!(i.receita&&i.receita.length))return;const c=cicloDe(i.id,i.receita);if(c){const k=[...new Set(c)].sort().join('|');if(!ks.has(k)){ks.add(k);out.push(c)}}});return out}
function custoProd(p){if(p.ficha&&p.ficha.length)return p.ficha.reduce((a,l)=>{const x=ins(l.id);return a+(x?l.qtd*custoIns(x):0)},0);return p.custoManual||0}

async function transmitir(nota){
 const c=S.cfg;
 if(CLOUD()){if(!navigator.onLine){nota.status='pendente';nota.msg='Sem internet: nota em fila, será transmitida ao reconectar.';return}
  try{const r=await api('POST','/nfce/transmit',{payload:payloadNota(nota)});nota.numero=r.numero;nota.status=r.status;nota.chave=r.chave;nota.protocolo=r.protocolo;nota.msg=r.msg}catch(e){nota.status='pendente';nota.msg='Servidor inacessível: nota em fila.'}return}
 if(!navigator.onLine){nota.status='pendente';nota.msg='Sem internet: nota em contingência, será transmitida ao reconectar.';return}
 if(c.provedor==='simulado'){nota.status='autorizada';nota.chave=nota.chave||mkChave(nota.numero,nota.data);nota.protocolo='SIM'+Date.now().toString().slice(-9);nota.msg='Autorizada em simulação, sem valor fiscal.';return}
 try{
  const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.token},body:JSON.stringify(payloadNota(nota))});
  const j=await r.json().catch(()=>({}));
  if(r.ok&&(j.status==='autorizada'||j.chave)){nota.status='autorizada';nota.chave=j.chave||'';nota.protocolo=j.protocolo||'';nota.msg=j.mensagem||'Autorizada.'}
  else{nota.status='rejeitada';nota.msg=j.mensagem||('Rejeitada pelo provedor (HTTP '+r.status+').')}
 }catch(e){nota.status='pendente';nota.msg='Provedor inacessível: nota pendente de transmissão.'}
}

 const card=d=>{const sub=subtotal(d.itens);const nxt={novo:['preparo','Aceitar e preparar'],preparo:['pronto','Marcar pronto'],pronto:['rota','Enviar entrega'],rota:['entregue','Concluir e receber']}[d.status];
  return`<div class="ped"><div class="row"><b>${esc(d.cliente)}</b>${chip(d.canal,d.canal==='iFood'?'bad':'')}<span class="muted right">${mins(d.criado)} min</span></div>
  <span class="muted">${esc(d.end)}${d.tel?' · '+esc(d.tel):''}</span>
  <span>${d.itens.map(i=>qf(i.qtd)+'× '+esc(prod(i.pid)?.nome||'?')).join(', ')}</span>
  <span><b>${money(sub+d.taxa)}</b> <span class="muted">(entrega ${money(d.taxa)}) · ${esc(d.forma)}${d.forma==='Dinheiro'&&d.trocoPara?' troco p/ '+money(d.trocoPara):''}${d.pago?' · pago':''}</span></span>
  ${d.entregador?`<span>Entregador: <b>${esc(S.entregadores.find(e=>e.id===d.entregador)?.nome||'')}</b></span>`:''}
  ${d.obs?`<span class="muted">Obs.: ${esc(d.obs)}</span>`:''}
  <div class="row">${nxt?`<button class="btn sm pri" data-act="delnext" data-id="${d.id}">${nxt[1]}</button>`:''}${['novo','preparo','pronto','rota'].includes(d.status)?`<button class="btn sm bad" data-act="delcancel" data-id="${d.id}">Cancelar</button>`:''}</div></div>`};
 return head('Delivery','Pedidos próprios, WhatsApp e iFood no mesmo fluxo.',`<button class="btn" data-act="ifoodsim">Simular pedido iFood</button><button class="btn" data-act="copycard">Copiar cardápio</button><button class="btn pri" data-act="newdel">Novo pedido</button>`)+
 `<div class="banner">A conexão real com o iFood exige credenciais de parceiro e servidor próprio. Aqui o botão de simulação mostra como o pedido entra no fluxo.</div>
 <div class="kan">${DEL_ST.map(([k,t])=>{const l=ped.filter(d=>d.status===k).slice(k==='entregue'?-6:0);return`<div class="col"><h3>${t}<span class="chip">${l.length}</span></h3>${l.map(card).join('')||'<span class="muted">Vazio</span>'}</div>`}).join('')}</div>
 <div class="card" style="margin-top:14px"><h2>Entregadores</h2>${S.entregadores.map(e=>`<div class="row" style="margin:4px 0"><b>${esc(e.nome)}</b><span class="muted">${esc(e.tel)}</span><span class="chip">${ped.filter(d=>d.entregador===e.id&&d.status==='rota').length} em rota</span></div>`).join('')}
 <div class="form" style="margin-top:8px">${field('Nome','en_nome','')}${field('Telefone','en_tel','')}<label>&nbsp;<button class="btn" data-act="addent">Adicionar entregador</button></label></div>
 <p class="muted">Rastreio no mapa depende de um aplicativo do entregador com GPS e não está incluído nesta versão.</p></div>`}

function vCozinha(){
 const its=cozItens();const dl=S.delivery.filter(d=>d.status==='preparo');
 return head('Cozinha','Itens enviados e ainda não prontos, do mais antigo ao mais recente.')+
 `<div class="grid g2"><div class="card"><h2>Salão e balcão</h2>${its.sort((a,b)=>new Date(a.it.env)-new Date(b.it.env)).map(({c,it,k})=>`<div class="row" style="margin:6px 0"><b>${qf(it.qtd)}× ${esc(prod(it.pid)?.nome)}</b><span class="muted">${esc(c.local)} · ${mins(it.env)} min${it.obs?' · '+esc(it.obs):''}</span><button class="btn sm pri right" data-act="pronto" data-id="${c.id}" data-k="${k}">Pronto</button></div>`).join('')||'<p class="muted">Nenhum item aguardando.</p>'}</div>
 <div class="card"><h2>Delivery em preparo</h2>${dl.map(d=>`<div class="row" style="margin:6px 0"><div><b>${esc(d.cliente)}</b> <span class="muted">${esc(d.canal)} · ${mins(d.criado)} min</span><br>${d.itens.map(i=>qf(i.qtd)+'× '+esc(prod(i.pid)?.nome)).join(', ')}</div><button class="btn sm pri right" data-act="delnext" data-id="${d.id}">Pronto</button></div>`).join('')||'<p class="muted">Nenhum pedido em preparo.</p>'}</div></div>`}

function vProdutos(){
 return head('Produtos e ficha técnica','Cada produto baixa o estoque pelos insumos da ficha e mostra custo real e margem.',`<button class="btn pri" data-act="newprod">Novo produto</button>`)+
 `<div class="card tw"><table><tr><th>Cód.</th><th>Produto</th><th>Categoria</th><th class="r">Preço</th><th class="r">Custo</th><th class="r">CMV</th><th class="r">Margem</th><th>Fiscal</th><th></th></tr>${S.produtos.map(p=>{const c=custoProd(p),m=p.preco?(p.preco-c)/p.preco*100:0;return`<tr><td class="muted">${esc(p.cod)}</td><td><b>${esc(p.nome)}</b>${p.tipo==='kg'?' '+chip('por kg'):''}</td><td>${esc(p.cat)}</td><td class="r">${money(p.preco)}</td><td class="r">${money(c)}</td><td class="r">${p.preco?(c/p.preco*100).toFixed(0):0}%</td><td class="r">${chip(m.toFixed(0)+'%',m<50?'bad':m<65?'warn':'ok')}</td><td class="muted">NCM ${esc(p.ncm)} · CFOP ${esc(p.cfop)}</td><td><button class="btn sm" data-act="editprod" data-id="${p.id}">Editar</button></td></tr>`}).join('')}</table></div>
 <p class="muted">NCM, CFOP e CSOSN vêm preenchidos com valores comuns. Confirme-os com o contador antes de emitir em produção.</p>`}

function vEstoque(){
 return head('Estoque','Insumos, mínimos e movimentações. Linhas em destaque estão no mínimo ou abaixo.',`<button class="btn" data-act="newins">Novo insumo</button><button class="btn pri" data-act="mov" data-id="">Movimentar estoque</button>`)+
 `<div class="card tw"><table><tr><th>Insumo</th><th class="r">Estoque</th><th class="r">Mínimo</th><th class="r">Custo unit.</th><th class="r">Valor em estoque</th><th></th></tr>${S.insumos.map(i=>`<tr class="${i.estoque<=i.min?'low':''}"><td><b>${esc(i.nome)}</b></td><td class="r">${qf(i.estoque)} ${i.un}</td><td class="r">${qf(i.min)}</td><td class="r">${money(custoIns(i))}</td><td class="r">${money(Math.max(0,i.estoque)*custoIns(i))}</td><td><button class="btn sm" data-act="mov" data-id="${i.id}">Movimentar</button> <button class="btn sm" data-act="editins" data-id="${i.id}">Editar</button></td></tr>`).join('')}</table></div>
 <div class="card" style="margin-top:12px"><h2>Últimas movimentações</h2>${S.movEst.slice(-8).reverse().map(m=>`<p style="margin:4px 0">${dmy(m.data)} ${hhmm(m.data)} · ${esc(m.tipo)} · ${esc(m.nome)} · ${qf(m.qtd)}</p>`).join('')||'<p class="muted">Nenhuma movimentação manual.</p>'}</div>`}

function vProducao(){
 const prep=S.insumos.filter(i=>i.receita&&i.receita.length);
 return head('Produção','Preparos internos (molhos, bases, caldos) consomem insumos e geram estoque do preparo.')+
 `<div class="grid g2">${prep.map(i=>`<div class="card"><h2>${esc(i.nome)}</h2><p class="muted">Rende ${qf(i.rend)} ${i.un} por lote · custo ${money(custoIns(i))}/${i.un} · estoque ${qf(i.estoque)}</p><p>${i.receita.map(l=>qf(l.qtd)+' '+(ins(l.id)?.un||'')+' '+esc(ins(l.id)?.nome||'?')).join(', ')}</p><div class="row"><input id="lote_${i.id}" value="1" style="width:80px" inputmode="decimal"><button class="btn pri" data-act="produzir" data-id="${i.id}">Produzir lotes</button></div></div>`).join('')||'<p class="muted">Nenhum preparo cadastrado. Crie um insumo e marque "É um preparo".</p>'}</div>
 <div class="card" style="margin-top:12px"><h2>Histórico</h2>${S.producao.slice(-10).reverse().map(p=>`<p style="margin:4px 0">${dmy(p.data)} ${hhmm(p.data)} · ${qf(p.lotes)} lote(s) de ${esc(p.nome)} · ${qf(p.qtd)} ${p.un} · ${money(p.custo)}</p>`).join('')||'<p class="muted">Nenhuma produção registrada.</p>'}</div>`}

function vFinanceiro(){
 const c=S.caixa;const dias=[];
 for(let d=-6;d<=7;d++){const x=new Date();x.setDate(x.getDate()+d);const k=dayKey(x);
  const ent=d<=0?toC(soma(S.vendas.filter(v=>dayKey(v.data)===k),v=>v.total)):0;
  const rec=S.contas.filter(a=>a.tipo==='receber'&&(a.pago?a.pagoEm===k:a.venc===k&&d>0)).reduce((a,b)=>a+toC(b.valor),0);
  const sai=S.contas.filter(a=>a.tipo==='pagar'&&(a.pago?a.pagoEm===k:a.venc===k&&d>0)).reduce((a,b)=>a+toC(b.valor),0);
  dias.push({l:x.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}),v:fromC(ent+rec-sai),neg:ent+rec-sai<0})}
 const pend=t=>S.contas.filter(a=>a.tipo===t).sort((a,b)=>a.pago-b.pago||a.venc.localeCompare(b.venc));
 const tb=t=>`<div class="tw"><table><tr><th>Descrição</th><th>Vencimento</th><th class="r">Valor</th><th></th></tr>${pend(t).map(a=>`<tr><td>${esc(a.desc)}</td><td>${dmy(a.venc+'T12:00')}</td><td class="r">${money(a.valor)}</td><td>${a.pago?chip('pago','ok'):(a.venc<dayKey(Date.now())?chip('vencida','bad'):'')} ${a.pago?'':`<button class="btn sm" data-act="baixarconta" data-id="${a.id}">${t==='pagar'?'Pagar':'Receber'}</button>`}</td></tr>`).join('')}</table></div>`;
 return head('Financeiro','Caixa, contas a pagar e receber e fluxo de caixa.')+
 `<div class="grid g2"><div class="card"><h2>Caixa ${chip(c.aberto?'aberto':'fechado',c.aberto?'ok':'bad')}</h2>${c.aberto?`<p>Aberto às ${hhmm(c.em)} com ${money(c.abertura)}. Dinheiro esperado na gaveta: <b>${money(caixaEsperado())}</b></p><div class="row"><button class="btn" data-act="mvcaixa" data-t="sangria">Sangria</button><button class="btn" data-act="mvcaixa" data-t="suprimento">Suprimento</button><button class="btn bad" data-act="fechacaixa">Fechar caixa</button></div>`:`<div class="row">${field('Valor de abertura (troco)','abv','200,00','inputmode="decimal"')}<label>&nbsp;<button class="btn pri" data-act="abrecaixa">Abrir caixa</button></label></div>`}
 ${S.caixaHist.length?`<p class="muted" style="margin-top:8px">Último fechamento: esperado ${money(S.caixaHist.at(-1).esperado)}, contado ${money(S.caixaHist.at(-1).contado)}, diferença ${money(S.caixaHist.at(-1).dif)}.</p>`:''}</div>
 <div class="card"><h2>Fluxo de caixa (-6 a +7 dias)</h2>${bars(dias,v=>(Math.round(v)).toLocaleString('pt-BR'))}<p class="muted">Barras alaranjadas indicam saldo negativo no dia. Futuro considera contas pendentes.</p></div></div>
 ${can('contas')?`<div class="grid g2" style="margin-top:12px"><div class="card"><h2>Contas a pagar</h2>${tb('pagar')}</div><div class="card"><h2>Contas a receber</h2>${tb('receber')}</div></div>
 <div class="card" style="margin-top:12px"><h2>Nova conta</h2><div class="form">${sel('Tipo','cn_t',[['pagar','A pagar'],['receber','A receber']],'pagar')}${field('Descrição','cn_d','')}${field('Valor','cn_v','','inputmode="decimal"')}<label>Vencimento<input id="cn_venc" type="date" value="${dayKey(Date.now())}"></label><label>&nbsp;<button class="btn pri" data-act="addconta">Lançar</button></label></div></div>`:'<p class="muted" style="margin-top:12px">Contas a pagar e receber ficam disponíveis para gerente e proprietário.</p>'}`}

function vFiscal(){
 const c=S.cfg,ns=S.notas.slice().reverse();const semNota=S.vendas.filter(v=>!v.notaId).slice(-8).reverse();
 const cnt=k=>S.notas.filter(n=>n.status===k).length;
 return head('Fiscal NFC-e','A nota é opcional: o cliente escolhe na hora de fechar a conta.')+
 (c.provedor==='simulado'?`<div class="banner"><b>Modo simulação.</b> As notas abaixo não têm valor fiscal. Para emitir de verdade, configure um provedor de emissão (API) com certificado digital A1, CSC e inscrição estadual, em ambiente de homologação primeiro.</div>`:'')+
 `<div class="grid g4">${kpi('Autorizadas',cnt('autorizada'))}${kpi('Pendentes',cnt('pendente'),'aguardando transmissão')}${kpi('Rejeitadas',cnt('rejeitada'))}${kpi('Canceladas',cnt('cancelada'))}</div>
 <div class="card" style="margin-top:12px"><h2>Configuração de emissão</h2><div class="form">
 ${field('CNPJ (numérico ou alfanumérico)','c_cnpj',c.cnpj,'data-chg="cfg" data-k="cnpj" maxlength="18" autocapitalize="characters" style="text-transform:uppercase" placeholder="AA.AAA.AAA/AAAA-00"')}${field('Inscrição estadual','c_ie',c.ie,'data-chg="cfg" data-k="ie"')}${sel('UF','c_uf',Object.keys(UFC),c.uf).replace('<select','<select data-chg="cfg" data-k="uf"')}
 ${sel('Ambiente','c_amb',[['homologacao','Homologação'],['producao','Produção']],c.ambiente).replace('<select','<select data-chg="cfg" data-k="ambiente"')}${field('Série','c_serie',c.serie,'data-chg="cfgn" data-k="serie"')}${field('Próximo número','c_pn',c.proxNum,'data-chg="cfgn" data-k="proxNum"')}
 ${field('CSC (token)','c_csc',c.csc,'data-chg="cfg" data-k="csc"')}${field('ID do CSC','c_cscid',c.cscId,'data-chg="cfg" data-k="cscId"')}
 ${sel('Provedor','c_prov',[['simulado','Simulado (demonstração)'],['api','API de emissão (webservice)']],c.provedor).replace('<select','<select data-chg="cfg" data-k="provedor"')}
 ${field('URL da API','c_url',c.url,'data-chg="cfg" data-k="url" placeholder="https://..."')}${field('Token da API','c_tok',c.token,'data-chg="cfg" data-k="token" type="password"')}</div>
 <p class="muted">A chave de acesso usa o dígito verificador real (módulo 11). A transmissão à SEFAZ e a assinatura com certificado A1 são feitas pelo provedor; este painel envia os dados da venda em JSON e registra o retorno.</p></div>
 <div class="card" style="margin-top:12px"><h2>Notas emitidas</h2><div class="tw"><table><tr><th>Nº</th><th>Data</th><th class="r">Valor</th><th>Doc.</th><th>Status</th><th>Chave</th><th></th></tr>${ns.slice(0,40).map(n=>`<tr><td>${n.numero||'-'}/${n.serie}</td><td>${dmy(n.data)} ${hhmm(n.data)}</td><td class="r">${money(n.valor)}</td><td>${esc(n.doc||'consumidor')}</td><td>${chip(n.status,n.status==='autorizada'?'ok':n.status==='cancelada'?'':'bad')}${n.msg?`<br><span class="muted" style="white-space:normal;font-size:.78rem">${esc(n.msg)}</span>`:''}</td><td class="muted">${n.chave?esc(n.chave.replace(/(.{4})/g,'$1 ').trim().slice(0,24))+'…':'-'}</td><td>${['pendente','rejeitada'].includes(n.status)?`<button class="btn sm" data-act="reenviar" data-id="${n.id}">Reenviar</button>`:''}${n.status==='autorizada'?`<button class="btn sm bad" data-act="cancnota" data-id="${n.id}">Cancelar</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">Nenhuma nota.</td></tr>'}</table></div></div>
 <div class="card" style="margin-top:12px"><h2>Vendas sem nota</h2>${semNota.map(v=>`<div class="row" style="margin:5px 0"><span>#${v.n} · ${dmy(v.data)} ${hhmm(v.data)} · ${esc(v.local||v.canal||v.tipo)}</span><b>${money(v.total)}</b><button class="btn sm right" data-act="emitirvenda" data-id="${v.id}">Emitir NFC-e</button></div>`).join('')||'<p class="muted">Todas as vendas recentes têm nota.</p>'}<p class="muted">A NFC-e normalmente deve ser emitida no momento da venda. Emitir depois só serve para correções operacionais e segue as regras da sua UF.</p></div>`}

function vRelatorios(){
 const n=ui.relPer,vs=n===0?S.vendas:vendasDias(n),fat=soma(vs,v=>v.total),cm=soma(vs,cmv),porF={},porT={};
 vs.forEach(v=>{v.pagamentos.forEach(p=>porF[p.forma]=(porF[p.forma]||0)+p.valor);const k=v.tipo==='delivery'?'Delivery '+(v.canal||''):v.tipo==='salao'?'Salão':'Balcão';porT[k.trim()]=(porT[k.trim()]||0)+v.total});
 const top=topProdutos(vs);const porO={};vs.forEach(v=>{const k=v.op||'(sem operador)';porO[k]=(porO[k]||0)+v.total});
 return head('Relatórios','Resultados por período',[[1,'Hoje'],[7,'7 dias'],[30,'30 dias'],[0,'Tudo']].map(([k,t])=>`<button class="btn ${ui.relPer===k?'pri':''}" data-act="per" data-n="${k}">${t}</button>`).join(''))+
 `<div class="grid g4">${kpi('Faturamento',money(fat),vs.length+' vendas')}${kpi('Ticket médio',money(vs.length?fat/vs.length:0))}${kpi('CMV (custo)',money(cm),fat?(cm/fat*100).toFixed(0)+'% do faturamento':'')}${kpi('Lucro bruto',money(fat-cm),fat?((fat-cm)/fat*100).toFixed(0)+'% de margem':'')}</div>
 <div class="grid g2" style="margin-top:12px"><div class="card"><h2>Por forma de pagamento</h2>${hbar(Object.entries(porF).sort((a,b)=>b[1]-a[1]).map(([l,v])=>({l,v})),money)}</div><div class="card"><h2>Por canal</h2>${hbar(Object.entries(porT).sort((a,b)=>b[1]-a[1]).map(([l,v])=>({l,v})),money)}</div><div class="card"><h2>Por operador</h2>${hbar(Object.entries(porO).sort((a,b)=>b[1]-a[1]).map(([l,v])=>({l,v})),money)}</div></div>
 <div class="card" style="margin-top:12px"><h2>Produtos por receita</h2><div class="tw"><table><tr><th>Produto</th><th class="r">Qtd.</th><th class="r">Receita</th><th class="r">Custo</th><th class="r">Lucro</th></tr>${top.map(t=>`<tr><td>${esc(t.nome)}</td><td class="r">${qf(t.qtd)}</td><td class="r">${money(t.rec)}</td><td class="r">${money(t.custo)}</td><td class="r">${money(t.rec-t.custo)}</td></tr>`).join('')}</table></div></div>`}

function vAssistente(){
 const ex=['Quanto faturei hoje?','Qual o produto mais vendido na semana?','Quais insumos estão com estoque baixo?','Quais contas vencem esta semana?','Qual a margem dos pratos?','Tenho notas pendentes?'];
 return head('Assistente','Pergunte em linguagem natural sobre a operação.')+
 `<div class="card"><div class="chat" id="chat">${ui.chat.map(m=>`<div class="msg ${m.r}">${esc(m.t)}</div>`).join('')||'<p class="muted">Tente uma das perguntas abaixo.</p>'}</div>
 <div class="row" style="margin-bottom:8px">${ex.map(e=>`<button class="btn sm" data-act="ask" data-q="${esc(e)}">${esc(e)}</button>`).join('')}</div>
 <div class="row"><input id="iaq" placeholder="Pergunte algo, por exemplo: ticket médio de ontem" style="flex:1" value="${esc(ui.iaq)}"><button class="btn pri" data-act="askin">Perguntar</button></div>
 <p class="muted" style="margin-top:8px">Este assistente interpreta perguntas por palavras-chave e responde com os dados deste sistema. Para linguagem livre, conecte um modelo de linguagem por API em uma versão hospedada.</p></div>`}

function vConfig(){
 const c=S.cfg;
 return head('Configurações')+
 `<div class="card"><h2>Estabelecimento</h2><div class="form">${field('Nome','k_nome',c.nome,'data-chg="cfg" data-k="nome"')}${field('Taxa de serviço (%)','k_srv',c.servicoPct,'data-chg="cfgn" data-k="servicoPct"')}${field('Taxa de entrega padrão (R$)','k_ent',c.taxaEntrega,'data-chg="cfgn" data-k="taxaEntrega"')}<label>Mesas<span class="muted" style="display:block">Cadastre, edite e exclua em Salão → Gerenciar mesas.</span></label>${field('ID do restaurante no iFood','k_if',c.ifoodMerchant,'data-chg="cfg" data-k="ifoodMerchant"')}</div></div>
 ${CLOUD()?'<div class="card" style="margin-top:12px"><h2>Dados</h2><p>Os dados deste restaurante ficam no servidor e são sincronizados entre todos os computadores. Cópias de segurança são feitas pelo banco de dados da AWS.</p><div class="row"><button class="btn" data-act="backup">Gerar backup deste computador</button></div></div>':`<div class="card" style="margin-top:12px"><h2>Dados</h2><div class="row"><button class="btn" data-act="zerar">Limpar vendas, pedidos e contas de demonstração</button><button class="btn" data-act="backup">Gerar backup</button><button class="btn bad" data-act="resetall">Restaurar demonstração completa</button></div>
 <label style="margin-top:10px">Backup (copie e guarde; para restaurar, cole aqui e use o botão)<textarea id="bk" rows="4" placeholder="Cole aqui um backup JSON"></textarea></label><div class="row" style="margin-top:8px"><button class="btn" data-act="restaurar">Restaurar do texto colado</button></div></div>`}

 return{src,sub:fromC(subC),serv:fromC(servC),desc:fromC(descC),taxa:fromC(taxaC),total:fromC(totalC),pago:fromC(pagoC),falta:fromC(totalC-pagoC)}}

 <div class="row" style="margin-top:8px"><select id="pf" style="width:150px">${FORMAS.map(f=>`<option>${f}</option>`).join('')}</select><input id="pv" placeholder="Valor" inputmode="decimal" style="width:120px"><button class="btn sm" data-act="payadd">Lançar valor</button></div>`:''}</div>

async function confirmPay(){autoFix();const p=ui.pay,k=payCalc();
 if(!S.caixa.aberto)return toast('Abra o caixa em Financeiro antes de receber.');
 if(k.desc>0&&!can('desconto')&&!p.authDesc)return askAuth('desconto',()=>{p.authDesc=true;confirmPay()});
 if(k.falta>0.005)return toast('Ainda falta '+money(k.falta));
 if(p.emitir&&p.doc&&!(validaCPF(p.doc)||validaCNPJ(p.doc)))return toast('CPF ou CNPJ inválido.');
 if(p.emitir){const fp=fiscPend(refSrc(p.ref).itens);if(fp.length)return toast('NFC-e bloqueada: padrão fiscal sem validação do contador ou incompleto ('+fp.join('; ')+').')}
 let trocoC=Math.max(0,toC(-k.falta)),troco=fromC(trocoC),pags=p.pags.map(g=>({...g,valor:r2(g.valor)}));
 if(trocoC>0){const dinC=pags.filter(g=>g.forma==='Dinheiro').reduce((a,g)=>a+toC(g.valor),0);if(dinC<trocoC)return toast('O troco só pode sair de pagamento em dinheiro.');let restC=trocoC;pags.forEach(g=>{if(g.forma==='Dinheiro'&&restC>0){const t=Math.min(toC(g.valor),restC);g.valor=fromC(toC(g.valor)-t);restC-=t}});pags=pags.filter(g=>toC(g.valor)>0)}else troco=0;
 const src=k.src,del=p.ref.kind==='del';
 if(CLOUD()&&navigator.onLine){try{S.seq=(await api('POST','/counter',{name:'venda'})).n}catch(e){}}
 const v=mkVenda({tipo:del?'delivery':src.mesa?'salao':'balcao',itens:src.itens.map(i=>({pid:i.pid,qtd:i.qtd})),local:src.local||'',canal:src.canal||'',cliente:src.cliente||'',servico:k.serv,desc:k.desc,taxa:k.taxa,pagamentos:pags,troco});
 if(!del){baixa(src.itens,1);S.comandas=S.comandas.filter(c=>c.id!==src.id)}else{if(!src.baixado){baixa(src.itens,1);src.baixado=true}src.status='entregue';src.vendaId=v.id}
 let nota=null;if(p.emitir){nota=mkNota(v,p.doc,false);await transmitir(nota)}
 logA('Venda #'+v.n,money(v.total)+(k.desc?' · desconto '+money(k.desc):'')+(nota?' · NFC-e '+nota.numero:''));if(src.pdv)ui.pdv=null;save();ui.pay=null;ui.cmd=null;showReceipt(v,nota);render()}
function showReceipt(v,nota){const t=[S.cfg.nome,'Venda nº '+v.n+' · '+dmy(v.data)+' '+hhmm(v.data),...v.itens.map(i=>`${qf(i.qtd)} x ${i.nome}  ${money(i.qtd*i.preco)}`),v.serv?'Serviço: '+money(v.serv):'',v.desc?'Desconto: -'+money(v.desc):'',v.taxa?'Entrega: '+money(v.taxa):'','TOTAL: '+money(v.total),...v.pagamentos.map(g=>g.forma+': '+money(g.valor)),v.troco?'Troco: '+money(v.troco):'',nota?`NFC-e ${nota.numero}/${nota.serie} · ${nota.status}${nota.chave?'\nChave: '+nota.chave:''}`:'Sem NFC-e (comprovante não fiscal)'].filter(Boolean).join('\n');
 showModal(mh('Venda registrada')+(nota&&nota.status!=='autorizada'?`<div class="banner">NFC-e ${esc(nota.status)}: ${esc(nota.msg)}</div>`:'')+`<pre>${esc(t)}</pre><div class="row" style="margin-top:10px"><button class="btn pri" data-act="copyrec" data-t="${esc(t)}">Copiar comprovante</button><button class="btn" data-act="close">Concluir</button></div>`)}

/* ===== Assistente ===== */
function answer(q){const t=norm(q);
 const per=/ontem/.test(t)?'ontem':/semana|7 dias/.test(t)?'semana':/mes|30 dias/.test(t)?'mes':'hoje';
 const get=()=>{if(per==='ontem'){const k=dayKey(Date.now()-864e5);return S.vendas.filter(v=>dayKey(v.data)===k)}return per==='hoje'?vendasHoje():per==='semana'?vendasDias(7):vendasDias(30)};
 const lab={hoje:'hoje',ontem:'ontem',semana:'nos últimos 7 dias',mes:'nos últimos 30 dias'}[per];
 if(/ticket/.test(t)){const v=get();return`Ticket médio ${lab}: ${money(v.length?soma(v,x=>x.total)/v.length:0)} em ${v.length} vendas.`}
 if(/mais vendid|top|campea|popular/.test(t)){const tp=topProdutos(get()).sort((a,b)=>b.qtd-a.qtd).slice(0,3);return tp.length?`Mais vendidos ${lab}:\n`+tp.map((x,i)=>`${i+1}. ${x.nome}: ${qf(x.qtd)} (${money(x.rec)})`).join('\n'):'Sem vendas no período.'}
 if(/estoque|insumo|acabando|falta/.test(t)){const b=baixos();return b.length?'Insumos no mínimo ou abaixo:\n'+b.map(i=>`${i.nome}: ${qf(i.estoque)} ${i.un} (mínimo ${qf(i.min)})`).join('\n'):'Nenhum insumo abaixo do mínimo.'}
 if(/pagar|vence|conta|boleto/.test(t)){const lim=dayKey(Date.now()+7*864e5);const c=S.contas.filter(a=>!a.pago&&a.venc<=lim).sort((a,b)=>a.venc.localeCompare(b.venc));return c.length?'Contas até 7 dias:\n'+c.map(a=>`${dmy(a.venc+'T12:00')} · ${a.tipo==='pagar'?'pagar':'receber'} · ${a.desc} · ${money(a.valor)}`).join('\n'):'Nenhuma conta nos próximos 7 dias.'}
 if(/margem|lucro|cmv|custo/.test(t)){const l=S.produtos.map(p=>({p,m:p.preco?(p.preco-custoProd(p))/p.preco*100:0})).sort((a,b)=>a.m-b.m);return'Menores margens do cardápio:\n'+l.slice(0,4).map(x=>`${x.p.nome}: ${x.m.toFixed(0)}% (custo ${money(custoProd(x.p))} / preço ${money(x.p.preco)})`).join('\n')}
 if(/delivery|entrega|ifood/.test(t)){const a=S.delivery.filter(d=>!['entregue','cancelado'].includes(d.status));return`Delivery em andamento: ${a.length}. `+DEL_ST.slice(0,4).map(([k,n])=>`${n}: ${a.filter(d=>d.status===k).length}`).join(', ')+'.'}
 if(/nota|nfc|fiscal/.test(t)){const p=notasPend();return p.length?`Há ${p.length} nota(s) pendentes ou rejeitadas. Veja a aba Fiscal.`:'Nenhuma nota pendente ou rejeitada.'}
 if(/caixa|gaveta/.test(t))return S.caixa.aberto?`Caixa aberto. Dinheiro esperado na gaveta: ${money(caixaEsperado())}.`:'O caixa está fechado.';
 if(/fatur|vend|receita|quanto/.test(t)){const v=get();return`Faturamento ${lab}: ${money(soma(v,x=>x.total))} em ${v.length} vendas. CMV ${money(soma(v,cmv))}.`}
 return'Não entendi. Pergunte sobre faturamento, ticket médio, mais vendidos, estoque baixo, contas a vencer, margem, delivery, notas ou caixa.'}

function pdvCart(){let c=S.comandas.find(x=>x.id===ui.pdv);if(!c)c=S.comandas.find(x=>x.pdv);if(!c){c={id:uid(),mesa:0,pdv:true,local:'PDV',itens:[],aberta:new Date().toISOString(),pessoas:1};S.comandas.push(c)}ui.pdv=c.id;return c}
function pdvGrid(){const q=norm(ui.q);return S.produtos.filter(p=>(ui.cat==='Todos'||p.cat===ui.cat)&&(!q||norm(p.nome).includes(q)||p.cod.startsWith(q))).map(p=>`<button class="pb" data-act="pdvp" data-id="${p.id}"><span>${esc(p.cod)}</span><b>${esc(p.nome)}</b><span>${money(p.preco)}${p.tipo==='kg'?' /kg':''}</span></button>`).join('')||'<span class="muted">Nenhum produto.</span>'}
function vPdv(){const c=pdvCart(),sub=subtotal(c.itens),cats=['Todos',...new Set(S.produtos.map(p=>p.cat))];
 return head('PDV','Frente de caixa. Digite o código ou o nome e tecle Enter. Use 3*101 para quantidade e 0,450*107 para peso.',`<span class="chip ${S.caixa.aberto?'ok':'bad'}">Caixa ${S.caixa.aberto?'aberto':'fechado'}</span>`)+
 (S.caixa.aberto?'':'<div class="banner">Abra o caixa em Financeiro para receber vendas.</div>')+
 `<div class="cmdgrid"><div><div class="row"><input id="pdvq" data-inp="pdvq" placeholder="Código ou nome do produto (F2)" autocomplete="off" style="flex:1;font-size:1.1rem" value="${esc(ui.q)}"><button class="btn pri" data-act="pdvadd">Adicionar</button></div>
 <div class="cats" style="margin-top:8px">${cats.map(k=>`<button class="btn sm ${ui.cat===k?'on':''}" data-act="pdvcat" data-k="${esc(k)}">${esc(k)}</button>`).join('')}</div><div class="pg" id="pdvgrid" style="max-height:60vh">${pdvGrid()}</div></div>
 <div class="card"><h3>Venda atual</h3>${c.itens.map((it,k)=>{const p=prod(it.pid);return`<div class="item"><div><b>${esc(p.nome)}</b><br><span class="muted">${money(p.preco)}${p.tipo==='kg'?' /kg':''} · ${money(p.preco*it.qtd)}</span></div><div class="qty">${p.tipo==='kg'?`<input value="${qf(it.qtd)}" data-chg="pdvkg" data-k="${k}" inputmode="decimal" aria-label="Peso em kg"> kg`:`<button class="btn sm" data-act="pdvqty" data-k="${k}" data-d="-1">-</button><b>${it.qtd}</b><button class="btn sm" data-act="pdvqty" data-k="${k}" data-d="1">+</button>`}<button class="btn sm bad" data-act="pdvrm" data-k="${k}" aria-label="Remover">x</button></div></div>`}).join('')||'<p class="muted">Nenhum item. Leia o código ou toque em um produto.</p>'}
 <div class="row" style="margin:10px 0"><span class="muted">${c.itens.length} item(ns)</span><div class="right" style="text-align:right"><span class="muted">Total</span><br><b style="font-size:1.8rem">${money(sub)}</b></div></div>
 <label class="ck" style="margin-bottom:8px"><input type="checkbox" data-chg="pdvnfce" ${ui.pdvNfce?'checked':''}> Emitir NFC-e nesta venda</label>
 <div class="row">${['Dinheiro','Pix','Débito','Crédito'].map(f=>`<button class="btn" data-act="pdvpay" data-f="${f}" ${c.itens.length?'':'disabled'}>${f}</button>`).join('')}</div>
 <div class="row" style="margin-top:8px"><button class="btn pri" data-act="pdvpay" data-f="" ${c.itens.length?'':'disabled'}>Receber (F8)</button><button class="btn bad" data-act="pdvclear" ${c.itens.length?'':'disabled'}>Limpar venda (F9)</button></div>
 <p class="muted" style="margin-top:8px">Atalhos: F2 busca, F8 receber, F9 limpar. Desconto e pagamento misto estão em "Receber".</p></div></div>`}
function pdvRefresh(){render();const q=$('#pdvq');if(q)q.focus()}
function pdvPut(p,q,explicit){const c=pdvCart();if(p.tipo==='kg'){c.itens.push({pid:p.id,qtd:explicit?q:0.5,obs:'',env:null,pronto:false})}else{const e=c.itens.find(i=>i.pid===p.id);if(e)e.qtd=r3(e.qtd+q);else c.itens.push({pid:p.id,qtd:q,obs:'',env:null,pronto:false})}save()}
function pdvAddText(t){t=String(t).trim();if(!t)return false;let q=1,k=t,ex=false;const m=t.match(/^([\d.,]+)\s*[*xX]\s*(.+)$/);if(m){q=num(m[1]);k=m[2].trim();ex=true}
 let p=S.produtos.find(x=>x.cod===k);if(!p){const n=norm(k),l=S.produtos.filter(x=>norm(x.nome).includes(n));if(l.length===1)p=l[0];else if(l.length>1){toast(l.length+' produtos encontrados: refine a busca ou toque em um.');return false}}
 if(!p){toast('Produto não encontrado: '+k);return false}if(!(q>0)){toast('Quantidade inválida.');return false}pdvPut(p,q,ex);return true}

 ${dono?`<div class="card" style="margin-top:12px"><h2>Bloqueio automático</h2><div class="form">${field('Bloquear após inatividade (minutos)','k_blq',S.cfg.bloqueioMin,'data-chg="cfgn" data-k="bloqueioMin" inputmode="numeric"')}</div></div>`:''}
 <div class="card tw" style="margin-top:12px"><h2>Auditoria (últimos 80 registros)</h2><table><tr><th>Data</th><th>Usuário</th><th>Ação</th><th>Detalhe</th></tr>${S.audit.slice(-80).reverse().map(a=>`<tr><td>${dmy(a.data)} ${hhmm(a.data)}</td><td>${esc(a.user)}</td><td>${esc(a.acao)}</td><td style="white-space:normal">${esc(a.det)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Sem registros.</td></tr>'}</table></div>
 <p class="muted" style="margin-top:12px">Esta proteção vale para o uso no balcão. Como os dados ficam no navegador, ela não substitui um servidor com login. Para vários dispositivos com segurança plena, é preciso a versão hospedada com banco de dados.</p>`}

Object.assign(A,{
 lsel(d){ui.loginSel=d.id;showLogin()},
 login(){if(bloqueado())return lmsg('Muitas tentativas. Aguarde '+Math.ceil((ui.lockUntil-Date.now())/1000)+' s.');const u=S.users.find(x=>x.id===ui.loginSel),pin=$('#lpin').value;
  if(u&&u.ativo&&u.pinHash===hashPin(u.id,pin)){tentativa(true);ui.user=u;u.ultimo=new Date().toISOString();ui.last=Date.now();logA('Login',PERFIS[u.perfil].nome);save();$('#login').hidden=true;render();if(ui.tab==='pdv'){const q=$('#pdvq');q&&q.focus()}}
  else{logA('Falha de PIN',u?u.nome:'-');tentativa(false);lmsg(bloqueado()?'Muitas tentativas. Aguarde 30 s.':'PIN incorreto.');const i=$('#lpin');if(i){i.value='';i.focus()}}},
 lock(){if(ui.user)logA('Bloqueio','sessão encerrada');ui.user=null;save();showLogin()},
 authok(){if(bloqueado())return $('#amsg').textContent='Aguarde alguns segundos.';const pin=$('#apin').value;const u=S.users.find(x=>x.ativo&&canP(x.perfil,askAuth.a)&&x.pinHash===hashPin(x.id,pin));

  tentativa(true);logA('Autorizado por '+u.nome,ACOES[askAuth.a]||askAuth.a);$('#cf').hidden=true;const f=askAuth.fn;askAuth.fn=null;f&&f()},
 mypin(){showModal(mh('Alterar meu PIN')+`<div class="form">${field('PIN atual','mp_a','','type="password" inputmode="numeric" maxlength="6"')}${field('Novo PIN (4 a 6 números)','mp_n','','type="password" inputmode="numeric" maxlength="6"')}</div><div class="row" style="margin-top:10px"><button class="btn pri" data-act="mypinsave">Salvar</button></div>`)},
 mypinsave(){const u=ui.user,a=$('#mp_a').value,n=$('#mp_n').value;if(u.pinHash!==hashPin(u.id,a))return toast('PIN atual incorreto.');if(!/^\d{4,6}$/.test(n))return toast('O novo PIN precisa ter de 4 a 6 números.');u.pinHash=hashPin(u.id,n);u.pinPadrao=false;logA('PIN alterado',u.nome);save();hideModal();toast('PIN alterado.')},
 newuser(){ui.eu={id:null,nome:'',perfil:'caixa',ativo:true};drawUser()},

 usersave(){const e=ui.eu,nome=$('#u_nome').value.trim(),perfil=$('#u_perfil').value,pin=$('#u_pin').value,ativo=$('#u_at').checked;
  if(!nome)return toast('Informe o nome.');if((!e.id||pin)&&!/^\d{4,6}$/.test(pin))return toast('O PIN precisa ter de 4 a 6 números.');
  if(!can('usuarios'))return toast('Somente o proprietário gerencia usuários.');
  const outros=S.users.filter(x=>x.id!==e.id&&x.ativo&&x.perfil==='dono');if((perfil!=='dono'||!ativo)&&!outros.length&&(!e.id||S.users.find(x=>x.id===e.id).perfil==='dono'))return toast('Mantenha ao menos um proprietário ativo.');
  if(e.id){const u=S.users.find(x=>x.id===e.id);u.nome=nome;u.perfil=perfil;u.ativo=ativo;if(pin){u.pinHash=hashPin(u.id,pin);u.pinPadrao=false}logA('Usuário alterado',nome+' · '+PERFIS[perfil].nome+(ativo?'':' · inativo')+(pin?' · novo PIN':''))}
  else{const u=mkUser(nome,perfil,pin);u.pinPadrao=false;S.users.push(u);logA('Usuário criado',nome+' · '+PERFIS[perfil].nome)}
  save();ui.eu=null;hideModal();toast('Usuário salvo.')},
 /* PDV */

 pdvrm(d){const c=pdvCart(),it=c.itens[+d.k];logA('PDV: item removido',prod(it.pid).nome+' · '+qf(it.qtd));c.itens.splice(+d.k,1);save();pdvRefresh()},
 pdvclear(){const c=pdvCart();if(!c.itens.length)return;guard('cancelar',()=>askConfirm('Limpar a venda atual?',()=>{logA('PDV: venda cancelada',c.itens.length+' item(ns) · '+money(subtotal(c.itens)));c.itens=[];save();pdvRefresh()}))},
 pdvpay(d){const c=pdvCart();if(!c.itens.length)return;if(!S.caixa.aberto)return toast('Abra o caixa em Financeiro antes de receber.');openPay({kind:'cmd',id:c.id});ui.pay.emitir=ui.pdvNfce;if(d.f){ui.pay.pags=[{forma:d.f,valor:payCalc().total,auto:true}]}drawPay()}
});

/* ===== Modo nuvem (AWS Lambda): login no servidor, sincronização entre dispositivos e fila offline ===== */
function CLOUD(){return !!(typeof window!=='undefined'&&window.MP_API)}
const cloud={tok:null,slug:'',tenant:null,cs:0,snap:{},busy:false,timer:null,pt:null,status:'idle',pub:[]};
const SYNC_ARR=['produtos','insumos','comandas','vendas','delivery','entregadores','notas','contas','producao','movEst','caixaHist','audit','gorjEquipe','gorjLanc','gorjFech','mesas'];
const SYNC_ALL=[...SYNC_ARR,'cfg','caixa'];
const FISCAL_KEYS=['url','token','provedor'];
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const canon=v=>Array.isArray(v)?'['+v.map(canon).join(',')+']':v&&typeof v==='object'?'{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}':JSON.stringify(v);
const ser=(c,d)=>{if(c==='insumos'){const x={...d};delete x.estoque;return canon(x)}return canon(d)};
const cfgForSync=()=>{const c={...S.cfg};FISCAL_KEYS.forEach(k=>delete c[k]);return c};

async function api(method,path,body,query){
 let r;const q=query?'?'+new URLSearchParams(query):'';
 try{r=await fetch(window.MP_API.replace(/\/+$/,'')+path+q,{method,headers:Object.assign({'content-type':'application/json'},cloud.tok?{authorization:'Bearer '+cloud.tok}:{}),body:body?JSON.stringify(body):undefined})}
 catch(e){const x=new Error('Sem conexão com o servidor.');x.status=0;throw x}
 const j=await r.json().catch(()=>({}));
 if(!r.ok){const x=new Error(j.erro||'Erro no servidor ('+r.status+').');x.status=r.status;throw x}
 return j}

 insumos:[],produtos:[],comandas:[],vendas:[],delivery:[],entregadores:[],notas:[],contas:[],caixa:{aberto:false,abertura:0,em:'',movs:[]},caixaHist:[],producao:[],movEst:[],audit:[],gorjEquipe:[],gorjLanc:[],gorjFech:[],mesas:[],users:[]}}
function catalogOnly(nome){const s=seed();s.cfg.nome=nome;s.cfg.cnpj='';s.cfg.ie='';['vendas','notas','delivery','comandas','contas','producao','movEst','audit','caixaHist','entregadores','gorjEquipe','gorjLanc','gorjFech'].forEach(k=>s[k]=[]);s.caixa={aberto:false,abertura:0,em:'',movs:[]};s.seq=1;s.users=[];return s}

/* cache local (permite operar sem internet) */
const cacheKey=()=>'mp_cloud_'+cloud.slug;
function saveCache(){try{localStorage.setItem(cacheKey(),JSON.stringify({S:Object.assign({},S,{users:[]}),snap:cloud.snap,cs:cloud.cs}))}catch(e){ui.storageOk=false}}
function loadCache(){try{const r=localStorage.getItem(cacheKey());if(r)return JSON.parse(r)}catch(e){}return null}
function cloudSaved(){if(!cloud.slug)return;saveCache();clearTimeout(cloud.pt);cloud.pt=setTimeout(syncNow,600)}

/* diferenças entre o estado local e o último estado sincronizado */
function recsOf(c){
 if(c==='cfg')return[{id:'main',d:cfgForSync()}];
 if(c==='caixa')return[{id:'main',d:S.caixa}];
 let arr=S[c]||[];if(c==='comandas')arr=arr.filter(x=>!x.pdv); // carrinho do PDV é local de cada máquina
 arr.forEach(x=>{if(!x.id)x.id=uid()});return arr.map(x=>({id:x.id,d:x}))}
function computeDiff(){const changes=[],incs=[];
 for(const c of SYNC_ALL){const cur=recsOf(c),sn=cloud.snap[c]||(cloud.snap[c]={}),seen=new Set();
  for(const {id,d} of cur){seen.add(id);const j=ser(c,d),s=sn[id];
   if(!s)changes.push({c,id,d,_j:j,_est:c==='insumos'?d.estoque:undefined});
   else{if(s.j!==j)changes.push({c,id,d,_j:j,_est:c==='insumos'?s.est:undefined});if(c==='insumos'&&r3(d.estoque-s.est)!==0)incs.push({c,id,delta:r3(d.estoque-s.est),_est:d.estoque})}}
  if(c!=='audit'&&c!=='cfg'&&c!=='caixa')for(const id of Object.keys(sn))if(!seen.has(id))changes.push({c,id,del:true})}
 return{changes,incs}}
function commit(b){

/* aplica o que veio do servidor sem atropelar edições locais ainda não enviadas */
function applyRecords(recs){let n=0;
 for(const r of recs){const c=r.c,sn=cloud.snap[c]||(cloud.snap[c]={});
  if(c==='cfg'||c==='caixa'){if(r.del||!r.d)continue;const loc=c==='cfg'?cfgForSync():S.caixa,s=sn.main;if(s&&s.j!==ser(c,loc))continue;if(c==='cfg')Object.assign(S.cfg,r.d);else S.caixa=r.d;const j=ser(c,r.d);if(!s||s.j!==j)n++;sn.main={j};continue}
  const arr=S[c];if(!arr)continue;const i=arr.findIndex(x=>x.id===r.id);
  if(r.del){if(i>=0){arr.splice(i,1);n++}delete sn[r.id];continue}
  if(i<0){if(sn[r.id])continue;arr.push(r.d);sn[r.id]={j:ser(c,r.d),est:c==='insumos'?r.d.estoque:undefined};n++;continue}
  const loc=arr[i],s=sn[r.id];
  if(c==='insumos'){const pend=s?r3(loc.estoque-s.est):0,dirty=s&&s.j!==ser(c,loc),j=ser(c,r.d);
   if(!dirty){if(!s||s.j!==j||s.est!==r.d.estoque||pend)n++;arr[i]=Object.assign({},r.d);sn[r.id]={j,est:r.d.estoque}}else sn[r.id]={j:s.j,est:r.d.estoque};
   arr[i].estoque=r3(r.d.estoque+pend)}
  else{if(s&&s.j!==ser(c,loc))continue;const j=ser(c,r.d);if(!s||s.j!==j)n++;arr[i]=r.d;sn[r.id]={j}}}
 return n}

async function syncNow(){
 if(!CLOUD()||!cloud.tok||cloud.busy)return;cloud.busy=true;let changed=0;
 try{
  setSync('sync');
  for(;;){const d=computeDiff();if(!d.changes.length&&!d.incs.length)break;
   const all=[...d.changes.map(x=>({t:'c',x})),...d.incs.map(x=>({t:'i',x}))].slice(0,150);
   const b={changes:all.filter(a=>a.t==='c').map(a=>a.x),incs:all.filter(a=>a.t==='i').map(a=>a.x)};
   const rs=await api('POST','/sync',{changes:b.changes.map(({c,id,d,del})=>({c,id,d,del})),incs:b.incs.map(({c,id,delta})=>({c,id,delta}))});commit(b);if(rs&&rs.rej)toast('Alguma alteração não foi aceita pelo servidor: o seu perfil não tem permissão. Peça ao proprietário.')}
  let cur=Math.max(0,cloud.cs-50);
  for(;;){const j=await api('GET','/sync',null,{since:String(cur)});changed+=applyRecords(j.records);cloud.cs=Math.max(cloud.cs,j.cs);cur=j.cs;if(!j.more)break}
  setSync('ok');saveCache();
  if(S.notas.some(n=>n.status==='pendente')){await retryPend()}
 }catch(e){
  if(e.status===401){setSync('idle');toast('Sessão expirada. Entre novamente.');A.lock()}
  else setSync(e.status===0?'off':'err')
 }finally{cloud.busy=false;if(changed)softRender()}}

function fiscPerfil(id){return((S.cfg.fisc||{}).perfis||[]).find(x=>x.id===id)}
function fiscItem(p){const pf=p.pf&&fiscPerfil(p.pf);return pf?{ncm:p.ncm,cest:pf.cest,cfop:pf.cfop,csosn:pf.csosn,cst_pis:pf.cstPis,cst_cofins:pf.cstCofins,origem:pf.origem}:{ncm:p.ncm,cfop:p.cfop,csosn:p.csosn}}
function fiscPend(itens){if(S.cfg.ambiente!=='producao')return[];const out=new Set();(itens||[]).forEach(i=>{const p=prod(i.pid);const pf=p&&p.pf&&fiscPerfil(p.pf);if(!pf)return;if(pf.status!=='validado'||!pf.cfop||!pf.csosn||!pf.cstPis||!pf.cstCofins)out.add(pf.nome)});return[...out]}
function fiscApur(mes){const out={},tot={v:0};
 S.vendas.filter(v=>dayKey(v.data).slice(0,7)===mes).forEach(v=>v.itens.forEach(i=>{const p=prod(i.pid)||{};const pf=p.pf&&fiscPerfil(p.pf);const k=pf?pf.id:'_sem';const val=linhaC(i.preco,i.qtd);out[k]=(out[k]||0)+val;tot.v+=val}));
 const serv=soma(S.vendas.filter(v=>dayKey(v.data).slice(0,7)===mes),v=>v.serv||0);Object.keys(out).forEach(k=>out[k]=fromC(out[k]));return{out,total:fromC(tot.v),serv}}

 gfreabrir(d){if(!needG())return;const f=S.gorjFech.find(x=>x.id===d.id);if(!f)return;askConfirm('Reabrir (excluir) o fechamento de '+dmy(f.ini+'T00:00:00')+' a '+dmy(f.fim+'T00:00:00')+'? Faça isso apenas se o valor ainda não foi pago.',()=>{S.gorjFech=S.gorjFech.filter(x=>x.id!==d.id);logA('Fechamento de gorjeta reaberto',dmy(f.ini+'T00:00:00')+' a '+dmy(f.fim+'T00:00:00'));save();render()})},
 fpadd(){if(!needF())return;S.cfg.fisc.perfis.push(PF('pf_'+uid(),'Novo padrão fiscal',{}));save();render()},
 fpdel(d){if(!needF())return;const p=S.cfg.fisc.perfis[+d.i];if(!p)return;if(S.produtos.some(x=>x.pf===p.id))return toast('Há produtos usando este padrão. Troque o padrão deles antes.');askConfirm('Excluir o padrão "'+p.nome+'"?',()=>{S.cfg.fisc.perfis.splice(+d.i,1);save();render()})},
 fpaplicar(){if(!needF())return;const c=$('#fa_cat').value,id=$('#fa_pf').value;const l=S.produtos.filter(p=>p.cat===c);l.forEach(p=>p.pf=id);logA('Padrão fiscal aplicado',c+' → '+(fiscPerfil(id)||{}).nome+' ('+l.length+' produtos)');save();render();toast(l.length+' produto(s) atualizados.')},
 fvalidar(){if(!needF())return;const F=S.cfg.fisc,V=F.validacao;if(!V.contador.trim()||!V.crc.trim())return toast('Informe o nome e o CRC do contador.');const dt=V.data||dayKey(Date.now());
  const pend=F.perfis.filter(p=>p.status!=='validado');if(!pend.length)return toast('Não há padrões pendentes.');
  const inc=pend.filter(p=>!p.cfop||!p.csosn||!p.cstPis||!p.cstCofins);if(inc.length)return toast('Complete CFOP, CSOSN e CST de PIS/COFINS em: '+inc.map(p=>p.nome).join('; '));
  askConfirm('Confirma que '+V.contador+' (CRC '+V.crc+') revisou e validou '+pend.length+' padrão(ões) fiscal(is)?',()=>{pend.forEach(p=>{p.status='validado';p.valPor=V.contador;p.valCrc=V.crc;p.valData=dt});V.status='validado';V.data=dt;V.hist=(V.hist||[]).concat([{data:dt,contador:V.contador,crc:V.crc,n:pend.length}]);logA('Padrões fiscais validados pelo contador',V.contador+' · CRC '+V.crc+' · '+pend.length);save();render();toast('Validação registrada.')})},
 fcsv(){const F=S.cfg.fisc,ap=fiscApur(ui.fmes);copyText(['padrao;icms_st;monofasico;receita',...F.perfis.filter(p=>ap.out[p.id]).map(p=>[p.nome,SIMNAO[p.st],SIMNAO[p.mono],String(ap.out[p.id]).replace('.',',')].join(';')),...(ap.out._sem?[['Sem padrão','-','-',String(ap.out._sem).replace('.',',')].join(';')]:[]),'taxa_servico_arrecadada;;;'+String(ap.serv).replace('.',',')].join('\n'))}});
/* ===== Salão: mesas cadastráveis, áreas, transferência, junção e conta pedida ===== */
const mkMesa=(num,o)=>Object.assign({id:'m'+num,num,nome:'',lugares:4,area:'Salão',ativa:true},o);
const mesaPorNum=n=>(S.mesas||[]).find(m=>m.num===n);
const rotuloMesa=m=>m.nome?`Mesa ${m.num} · ${m.nome}`:`Mesa ${m.num}`;
const cmdDaMesa=n=>S.comandas.find(x=>x.mesa===n&&!x.pdv);
const prontosNaoServidos=c=>c.itens.filter(i=>i.env&&i.pronto&&!i.servido).length;
const needM=()=>{if(!can('mesas')){toast('Seu perfil não pode cadastrar ou excluir mesas.');return false}return true};
function vSalao(){
 if(ui.gm&&can('mesas'))return vMesasGer();
 const ms=(S.mesas||[]).filter(m=>m.ativa!==false).sort((a,b)=>a.num-b.num),areas=[...new Set(ms.map(m=>m.area||'Salão'))];
 const fa=areas.includes(ui.area)?ui.area:'Todas',vis=ms.filter(m=>fa==='Todas'||(m.area||'Salão')===fa);
 const ocup=ms.filter(m=>cmdDaMesa(m.num)),emConsumo=soma(ocup,m=>subtotal(cmdDaMesa(m.num).itens)),contas=ocup.filter(m=>cmdDaMesa(m.num).conta).length;
 const card=m=>{const c=cmdDaMesa(m.num),pr=c?prontosNaoServidos(c):0;
  return`<button class="mesa ${c?'occ':''} ${c&&c.conta?'conta':''}" data-act="mesa" data-m="${m.num}"><div><b>${esc(rotuloMesa(m))}</b><small class="muted" style="display:block">${esc(m.area||'Salão')} · ${m.lugares} lugares</small></div>
  <div>${c?`<span>${money(subtotal(c.itens))} · ${mins(c.aberta)} min</span><div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap">${c.conta?chip('conta pedida','warn'):''}${pr?chip(pr+' pronto'+(pr>1?'s':''),'ok'):''}${c.gar?`<small class="muted">${esc(c.gar)}</small>`:''}</div>`:'<span class="muted">Livre</span>'}</div></button>`};
 const orf=S.comandas.filter(c=>!c.pdv&&(!c.mesa||!mesaPorNum(c.mesa)));
 return head('Salão e comandas','Abra uma mesa para lançar consumo; feche a conta com ou sem NFC-e.',`${can('mesas')?'<button class="btn" data-act="mesager">Gerenciar mesas</button> ':''}<button class="btn acc" data-act="balcao">Nova venda no balcão</button>`)+
 `<div class="grid g4">${kpi('Mesas livres',ms.length-ocup.length,'de '+ms.length+' ativas')}${kpi('Ocupadas',ocup.length)}${kpi('Em consumo',money(emConsumo))}${kpi('Contas pedidas',contas)}</div>`+
 (areas.length>1?`<div class="cats" style="margin-top:12px">${['Todas',...areas].map(a=>`<button class="btn sm ${fa===a?'on':''}" data-act="area" data-k="${esc(a)}">${esc(a)}</button>`).join('')}</div>`:'')+
 (ms.length?`<div class="mesas" style="margin-top:12px">${vis.map(card).join('')}</div>`:`<div class="card" style="margin-top:12px"><p>Nenhuma mesa cadastrada.</p>${can('mesas')?'<button class="btn pri" data-act="mesager">Cadastrar mesas</button>':'<p class="muted">Peça ao gerente ou ao proprietário para cadastrar as mesas.</p>'}</div>`)+
 (orf.length?`<div class="card" style="margin-top:14px"><h2>Balcão e comandas sem mesa cadastrada</h2>${orf.map(c=>`<div class="row" style="margin:6px 0"><b>${esc(c.local)}</b><span class="muted">${money(subtotal(c.itens))}</span><button class="btn sm right" data-act="opencmd" data-id="${c.id}">Abrir</button></div>`).join('')}</div>`:'')}
function vMesasGer(){
 const ms=(S.mesas||[]).slice().sort((a,b)=>a.num-b.num),prox=ms.reduce((a,m)=>Math.max(a,m.num),0)+1,areas=[...new Set(ms.map(m=>m.area||'Salão'))];
 return head('Gerenciar mesas','Inclua, ajuste ou exclua mesas. Mesa com comanda aberta não pode ser excluída nem desativada.',`<button class="btn" data-act="mesavoltar">Voltar ao salão</button>`)+
 `<div class="card"><h2>Adicionar mesa</h2><datalist id="dl_area">${areas.map(a=>`<option value="${esc(a)}">`).join('')}</datalist><div class="form">
 ${field('Número','mn_num',String(prox),'inputmode="numeric" maxlength="3"')}${field('Nome (opcional)','mn_nome','','placeholder="Ex.: Varanda, Janela"')}${field('Área','mn_area',areas[0]||'Salão','list="dl_area"')}${field('Lugares','mn_lug','4','inputmode="numeric" maxlength="2"')}</div>
 <div class="row" style="margin-top:10px"><button class="btn pri" data-act="mesaadd">Adicionar mesa</button></div>
 <h3 style="margin-top:14px">Criar várias de uma vez</h3><div class="form">${field('Quantidade','ml_qtd','5','inputmode="numeric" maxlength="2"')}${field('Área','ml_area',areas[0]||'Salão','list="dl_area"')}${field('Lugares por mesa','ml_lug','4','inputmode="numeric" maxlength="2"')}</div>
 <div class="row" style="margin-top:10px"><button class="btn" data-act="mesalote">Criar a partir da mesa ${prox}</button></div></div>
 <div class="card" style="margin-top:12px"><h2>Mesas cadastradas (${ms.length})</h2><div class="tw"><table><tr><th>Nº</th><th>Nome</th><th>Área</th><th class="r">Lugares</th><th>Ativa</th><th></th></tr>
 ${ms.map(m=>{const c=cmdDaMesa(m.num);return`<tr><td><b>${m.num}</b></td><td><input value="${esc(m.nome)}" data-chg="mesaf" data-id="${m.id}" data-k="nome" aria-label="Nome da mesa ${m.num}"></td><td><input value="${esc(m.area||'Salão')}" list="dl_area" data-chg="mesaf" data-id="${m.id}" data-k="area" aria-label="Área da mesa ${m.num}"></td><td class="r"><input value="${m.lugares}" data-chg="mesaf" data-id="${m.id}" data-k="lugares" inputmode="numeric" style="width:60px;text-align:right" aria-label="Lugares da mesa ${m.num}"></td><td><input type="checkbox" data-chg="mesaf" data-id="${m.id}" data-k="ativa" ${m.ativa!==false?'checked':''} aria-label="Mesa ${m.num} ativa"></td><td>${c?chip('ocupada','warn'):`<button class="btn sm bad" data-act="mesadel" data-id="${m.id}">Excluir</button>`}</td></tr>`}).join('')||'<tr><td colspan="6" class="muted">Nenhuma mesa.</td></tr>'}</table></div>
 <p class="muted">Excluir uma mesa não apaga vendas já feitas: o histórico guarda o nome da mesa no momento da venda. O número da mesa não pode ser alterado; para renumerar, exclua e crie de novo.</p></div>`}
function drawMove(){const c=curCmd();if(!c){hideModal();return}const j=ui.mv==='juntar';
 const opts=j?S.comandas.filter(x=>x.id!==c.id&&!x.pdv&&x.itens.length):(S.mesas||[]).filter(m=>m.ativa!==false&&!cmdDaMesa(m.num)&&m.num!==c.mesa).sort((a,b)=>a.num-b.num);
 showModal(`<div class="mh"><h2>${j?'Juntar com outra comanda':'Transferir para outra mesa'}</h2><button class="btn sm" data-act="mvback">Voltar</button></div>
 <p class="muted">${j?'Os itens desta comanda passam para a comanda escolhida, que continua aberta. Esta comanda é encerrada sem cobrança.':'A comanda e os itens já enviados à cozinha são mantidos; só muda a mesa.'}</p>
 <div class="mesas">${opts.map(o=>j?`<button class="mesa occ" data-act="mvjoin" data-id="${o.id}"><b>${esc(o.local)}</b><span>${money(subtotal(o.itens))}</span></button>`:`<button class="mesa" data-act="mvdo" data-m="${o.num}"><div><b>${esc(rotuloMesa(o))}</b><small class="muted" style="display:block">${esc(o.area||'Salão')} · ${o.lugares} lugares</small></div><span class="muted">Livre</span></button>`).join('')||'<p class="muted">Nenhuma opção disponível.</p>'}</div>`,true)}
Object.assign(CH,{
 mesaf(v,d){if(!needM())return render();const m=(S.mesas||[]).find(x=>x.id===d.id);if(!m)return;
  if(d.k==='ativa'){if(!v&&cmdDaMesa(m.num)){toast('Mesa com comanda aberta não pode ser desativada.');return render()}m.ativa=!!v}
  else if(d.k==='lugares')m.lugares=Math.max(1,Math.min(50,Math.round(num(v))||1));else if(d.k==='area')m.area=String(v).trim()||'Salão';else m.nome=String(v).trim().slice(0,30);
  logA('Mesa alterada',rotuloMesa(m)+' · '+d.k);save();render()}});
Object.assign(A,{
 mesa(d){const m=mesaPorNum(+d.m);if(!m||m.ativa===false)return toast('Mesa indisponível.');let c=cmdDaMesa(m.num);if(!c){c={id:uid(),mesa:m.num,local:rotuloMesa(m),itens:[],aberta:new Date().toISOString(),pessoas:1,gar:ui.user?ui.user.nome:''};S.comandas.push(c)}ui.cmd=c.id;ui.cat='Todos';ui.q='';drawCmd()},
 balcao(){const n=S.comandas.filter(c=>!c.mesa&&!c.pdv).length+1;const c={id:uid(),mesa:0,local:'Balcão '+n,itens:[],aberta:new Date().toISOString(),pessoas:1,gar:ui.user?ui.user.nome:''};S.comandas.push(c);ui.cmd=c.id;ui.cat='Todos';ui.q='';drawCmd()},
 area(d){ui.area=d.k;render()},
 mesager(){if(!needM())return;ui.gm=true;render()},mesavoltar(){ui.gm=false;render()},
 mesaadd(){if(!needM())return;const n=Math.round(num($('#mn_num').value)),lug=Math.max(1,Math.min(50,Math.round(num($('#mn_lug').value))||4));
  if(!(n>=1&&n<=999))return toast('Número da mesa deve ficar entre 1 e 999.');if(mesaPorNum(n))return toast('Já existe a mesa '+n+'.');if((S.mesas||[]).length>=200)return toast('Limite de 200 mesas.');
  const m=mkMesa(n,{nome:$('#mn_nome').value.trim().slice(0,30),area:$('#mn_area').value.trim()||'Salão',lugares:lug});S.mesas.push(m);logA('Mesa criada',rotuloMesa(m));save();render();toast('Mesa '+n+' adicionada.')},
 mesalote(){if(!needM())return;const q=Math.round(num($('#ml_qtd').value)),lug=Math.max(1,Math.min(50,Math.round(num($('#ml_lug').value))||4)),area=$('#ml_area').value.trim()||'Salão';
  if(!(q>=1&&q<=50))return toast('Informe de 1 a 50 mesas.');let n=S.mesas.reduce((a,m)=>Math.max(a,m.num),0);if(n+q>999||S.mesas.length+q>200)return toast('Limite de mesas excedido.');
  for(let i=0;i<q;i++)S.mesas.push(mkMesa(++n,{area,lugares:lug}));logA('Mesas criadas',q+' mesas na área '+area);save();render();toast(q+' mesas criadas.')},
 mesadel(d){if(!needM())return;const m=S.mesas.find(x=>x.id===d.id);if(!m)return;const c=cmdDaMesa(m.num);if(c)return toast('A '+rotuloMesa(m)+' tem comanda aberta ('+money(subtotal(c.itens))+'). Feche ou transfira antes de excluir.');
  askConfirm('Excluir a '+rotuloMesa(m)+'? Vendas já feitas não são afetadas.',()=>{S.mesas=S.mesas.filter(x=>x.id!==m.id);logA('Mesa excluída',rotuloMesa(m));save();render()})},
 mvopen(d){ui.mv=d.mode;drawMove()},mvback(){drawCmd()},
 mvdo(d){const c=curCmd(),m=mesaPorNum(+d.m);if(!c||!m)return;if(cmdDaMesa(m.num))return toast('A mesa foi ocupada. Escolha outra.');const de=c.local;c.mesa=m.num;c.local=rotuloMesa(m);logA('Comanda transferida',de+' → '+c.local);save();toast('Comanda transferida para '+c.local+'.');drawCmd()},
 mvjoin(d){const c=curCmd(),t=S.comandas.find(x=>x.id===d.id);if(!c||!t)return;
  askConfirm('Juntar '+c.local+' em '+t.local+'? Os itens passam para '+t.local+'.',()=>{t.itens.push(...c.itens);t.pessoas=(t.pessoas||1)+(c.pessoas||1);t.conta=false;logA('Comandas juntadas',c.local+' → '+t.local+' · '+money(subtotal(c.itens)));S.comandas=S.comandas.filter(x=>x.id!==c.id);ui.cmd=t.id;save();toast('Comandas juntadas.');drawCmd()})},
 pconta(){const c=curCmd();if(!c)return;c.conta=!c.conta;save();drawCmd()},
 servir(d){const c=curCmd(),it=c&&c.itens[+d.k];if(!it)return;it.servido=new Date().toISOString();save();drawCmd()}});
if(CLOUD()){S=blankState('');showLogin()}else{S=load();save();retryPend();if(ui.user)render();else showLogin()}

</script>
